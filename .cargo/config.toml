# Debug and test builds keep line tables only: backtraces still name file and line, at a fraction of the target size.
[profile.dev]
debug = "line-tables-only"

# Debug and test builds are incremental, so an edit in the main checkout rebuilds only what changed. sccache passes
# incremental crates through uncached, so `cargo xtask ci` sets CARGO_INCREMENTAL=0 in CI and in linked worktrees
# (agents' checkouts), which then share the workspace's own crates through sccache. `[limits] target_gib` in
# .config/validation.toml bounds the incremental session data with the rest of `target/debug`.
incremental = true

# Compiled crates are shared between checkouts through sccache's cache.
[build]
rustc-wrapper = "sccache"

# `cargo xtask ci` plans and runs the checks a change needs (.config/validation.toml).
[alias]
xtask = "run --locked --quiet --package xtask --"
# The release build of every program, with the feature set the packages use: every feature of the workspace's packages
# but `cupertino-kit/test`, which only dev-dependencies enable. `cupertino-layers` checks the list.
# A string, not a list: Cargo joins a list alias with the same alias of every .cargo/config.toml above the working
# directory, so the package build's checkout, which makepkg clones inside this one, ran `cargo build build ...`.
build-programs = '''
    build
    --locked
    --release
    --workspace
    --bins
    --features=cupertino-app-protocols/client
    --features=cupertino-app-protocols/server
    --features=cupertino-apps/dbus
    --features=cupertino-apps/watch
    --features=cupertino-btd/app
    --features=cupertino-btd/dbus
    --features=cupertino-diagnostic-events/tracy
    --features=cupertino-files/app
    --features=cupertino-login/app
    --features=cupertino-login/dbus
    --features=cupertino-netd/app
    --features=cupertino-netd/dbus
    --features=cupertino-powerd/app
    --features=cupertino-powerd/dbus
    --features=cupertino-protocols/client
    --features=cupertino-protocols/cupertino-app-protocols
    --features=cupertino-protocols/server
    --features=cupertino-radios/dbus
    --features=cupertino-server/dbus
    --features=cupertino-server/udev
    --features=cupertino-server/winit
    --features=cupertino-sessiond/app
'''
