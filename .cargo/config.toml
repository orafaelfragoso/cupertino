# Debug and test builds keep line tables only: backtraces still name file and line, at a fraction of the target size.
[profile.dev]
debug = "line-tables-only"

# Debug and test builds are incremental (cargo's default), so an edit rebuilds only what changed. CI and packaging set
# CARGO_INCREMENTAL=0 themselves.

# Link through ci/linker.sh, which uses mold when it is installed.
[target.x86_64-unknown-linux-gnu]
linker = "ci/linker.sh"
