# Every test runs in its own process. A test that runs longer than `period` is reported as slow every
# period; after `terminate-after` periods it is killed and fails by name, so a hang costs 2 minutes,
# not the whole run.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

# CI (`cargo xtask ci` passes `--profile ci` when CI is set): the default profile's settings and JUnit report.
[profile.ci]

# Keep the longer ABI conformance budget; its cdylib fixture is prepared before the test runner starts.
[[profile.default.overrides]]
filter = 'package(cupertino-ui-abi) & test(/^symbols::/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The launcher's frame budgets are held in the CPU time of the loop's thread. Tests running on every other processor
# still slow that thread through the caches and cores they share, past the budgets' margin, so these tests run with no
# other test beside them.
[[profile.default.overrides]]
filter = 'package(cupertino-launcher) & (test(/fits_the_budget/) | test(/keeps_icon_decoding_off_the_frames/))'
threads-required = "num-cpus"

# The live resize tests time how long each size a window is asked for takes to be shown, against a bound of a few
# frames; real Files and Settings processes compile and draw on the GPU beside the server, and tests beside them on
# every other processor push those waits past the bound, so they run with no other test beside them.
[[profile.default.overrides]]
filter = 'binary_id(cupertino-server::suite) & test(/^gpu_resize::/)'
threads-required = "num-cpus"

# The GPU slice's missed refreshes are counted against the display's real refresh; tests beside it on every other
# processor hold the session's loop past a refresh, so it runs with no other test beside it.
[[profile.default.overrides]]
filter = 'binary_id(cupertino-server::suite) & test(=gpu_slice::the_slice_counts_no_missed_refresh_when_the_session_keeps_up_and_every_overdraw_capture_is_flat)'
threads-required = "num-cpus"

# The GPU renderer's large window is timed against the CPU budget of recording and issuing a frame; programs compiled
# and frames drawn on the same device by tests beside it starve the driver's threads, so it runs alone.
[[profile.default.overrides]]
filter = 'package(cupertino-ui-gpu) & test(/^timing::/)'
threads-required = "num-cpus"

# The launcher's fold and unfold on the compositor's clock give the first frame's buffers a short window to reach the
# server (six server steps for the fold, 50 ms for the unfold, where alone they take 2 to 6 ms), and the server holds
# each commit until the launcher's drawing of it is done on the GPU; frames drawn and programs compiled on the same
# device by tests beside them hold that drawing back by up to 50 ms, so they run with no other test beside them.
[[profile.default.overrides]]
filter = 'binary_id(cupertino-server::suite) & (test(=shell_processes::the_launcher_folds_a_scope_on_the_compositor_s_clock_drawing_its_row_at_most_once) | test(=shell_processes::the_launcher_unfolds_the_search_field_on_the_compositor_s_clock_drawing_its_row_at_most_once))'
threads-required = "num-cpus"
