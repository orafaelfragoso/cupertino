# The slow tier: tests that run whole programs, private buses and displays, wait on real time, or measure. CI runs it
# on every change; locally, `scripts/test --slow`. A test belongs here only when it cannot be made fast: give the reason
# beside its line.
# The compositor's dither drawn on the GL path against its definition (`dither::`) makes a GL context and compiles
# programs like the other shader-against-model tests here.
# Tests that start the whole shell or several real client processes and draw whole outputs (app grid, dock menus,
# lock screen, scene repaints, minimize meshes, output seams), or walk the whole source tree, take 2 to 3.5 s on an idle
# machine, past the fast tier's budget.
# The GPU slice's sessions run its client process for 60 to 180 frames at the display's real refresh (1 to 3 s each).
# The GPU layer's device tests (cupertino-gpu's suite and its borrowed-context test) each make one or more GLES contexts
# and compile programs: about 0.2 s alone, past a second when the driver makes many at once.
# Whole-window pixel comparisons at several scales (kit damage_coverage, control_fixtures::alert, files kit_damage idle
# window) and the control panel moving between outputs, which starts the real shell process again, take 3 to 8 s.
