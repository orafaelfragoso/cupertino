name: CI images

# Publish reusable BuildKit layers from trusted main; first-use callers can build from source.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/goldens/Dockerfile'
      - '.github/actions/golden-image/**'
      - '.github/workflows/ci-images.yml'

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/golden-image
