name: CI image

# The CI and package-build image (.github/images/arch/Dockerfile), published to the GitHub Container Registry under a
# tag that is the Dockerfile's sha256, so a tag always names the image of one definition. Every workflow that runs in
# the image calls this one first: it builds and pushes the image only when its tag is not in the registry yet (the first
# run after the Dockerfile changes), and otherwise just returns the image name.
on:
  workflow_call:
    outputs:
      image:
        description: The image reference, ghcr.io/OWNER/cupertino-ci-arch:SHA256-OF-THE-DOCKERFILE
        value: ${{ jobs.image.outputs.image }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/images/arch/**'
      - '.github/workflows/ci-images.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          hash=$(sha256sum .github/images/arch/Dockerfile | cut -d ' ' -f 1)
          echo "image=ghcr.io/${OWNER,,}/cupertino-ci-arch:$hash" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s\n' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - id: present
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "CI image $IMAGE is in the registry." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CI image $IMAGE is new: building it from the Dockerfile." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.present.outputs.present != 'true'
        with:
          cache-binary: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.present.outputs.present != 'true'
        with:
          context: .github/images/arch
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Log out
        if: always()
        run: docker logout ghcr.io
