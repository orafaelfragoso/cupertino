name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  # Source policy: no provenance text, no vendor names, no forbidden or binary files except the pinned built-in font.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 ci/gate.py .

  # Licences, advisories, bans and sources, as set in deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Without --all: only the workspace members, not the vendored third-party crate.
      - run: cargo fmt --check

  # Lint, layer rules and the whole test suite on one build. No CUPERTINO_* variable is set anywhere in this
  # workflow: the tests must pass on the built-in assets alone.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgbm-dev libpam0g-dev dbus libgl1-mesa-dri libegl1 xkb-data
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Layer rules
        run: cargo run -p cupertino-layers
      - name: Tests
        run: cargo test --workspace --all-features --no-fail-fast
