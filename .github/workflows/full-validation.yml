name: Full validation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = schedule ]; then
            validated=$(gh api "repos/$GH_REPO/actions/workflows/full-validation.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
            if [ "$validated" -gt 0 ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Full validation already passed for $SHA; scheduled duplicate skipped." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: selection
    if: needs.selection.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  arch-package:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free unused runner SDKs before restoring build caches
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: image-cache
        with:
          path: ${{ runner.temp }}/package-images
          key: package-image-${{ runner.os }}-arch-${{ hashFiles('packaging/ci/Dockerfile') }}
      - name: Build, check, upgrade-test and install-test the Arch packages
        env:
          CUPERTINO_BUILD_CACHE_DIR: ${{ runner.temp }}/package-images
          CARGO_BUILD_JOBS: '4'
        run: bash packaging/ci/build-in-container.sh arch out/arch --upgrade
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/package-images
          key: package-image-${{ runner.os }}-arch-${{ hashFiles('packaging/ci/Dockerfile') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arch-package-validation
          path: out/arch/**/*.log
          if-no-files-found: warn
          retention-days: 7
