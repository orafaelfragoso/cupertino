# ISO: the live and install image of one commit, kept as a workflow artifact. Never on a pull request or a push: the
# release workflow calls it for a final release and attaches the image, and it can be run by hand from the Actions tab
# on any branch or tag to try a candidate on hardware (then it builds and install-tests the packages first).
#
# The packages go into a local pacman repository with the cupertino-keyring package, and mkarchiso (in the CI image,
# privileged) assembles packaging/iso around it. The Cupertino packages follow from the commit; the rest comes from the
# image's archive date, and the manifest records every installed package version. SOURCE_DATE_EPOCH is the commit time.
#
# The installed system trusts the release key: its public half (PUBLIC.asc) is the repository variable
# CUPERTINO_KEYRING_PUBLIC_KEY. Without it the build stops before anything runs, and the build refuses a key whose
# fingerprint is not packaging/keyring/release-key.fpr. The release workflow signs the image's checksum.
name: ISO

on:
  workflow_call:
    inputs:
      reuse-packages:
        description: Take the packages-arch artifact this run already made instead of building it
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    if: ${{ !inputs.reuse-packages }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-images.yml

  iso:
    needs: [packages, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.packages.result == 'success' || needs.packages.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    # mkarchiso mounts and loop-attaches; it needs a privileged container.
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --privileged
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache/CodeQL:/host/codeql
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # makepkg (the keyring package) runs as the build user.
      - uses: ./.github/actions/arch-setup
        with:
          free-disk: 'true'
      # the run steps here are root's; the setup action gave the checkout to the build user
      - name: Root reads the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Release public key
        env:
          PUBLIC_KEY: ${{ vars.CUPERTINO_KEYRING_PUBLIC_KEY }}
        run: |
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::set the repository variable CUPERTINO_KEYRING_PUBLIC_KEY to the release key's PUBLIC.asc"
            exit 1
          fi
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/PUBLIC.asc"
      # The installed system trusts the key the ISO carries: the file must hold exactly one primary key, no secret key,
      # and the primary must be the fingerprint checked into the tree.
      - name: The key is the release key
        run: |
          key=$RUNNER_TEMP/PUBLIC.asc
          expected=$(tr -d ' \n' < packaging/keyring/release-key.fpr | tr a-f A-F)
          [[ "$expected" =~ ^[0-9A-F]{40}$ ]] || { echo "::error::release-key.fpr does not hold one 40-digit fingerprint"; exit 1; }
          home=$(mktemp -d)
          chmod 700 "$home"
          listing=$(GNUPGHOME=$home gpg --batch --with-colons --show-keys "$key" 2>/dev/null) \
            || { echo "::error::the public key is not a public key file"; exit 1; }
          rm -rf "$home"
          primaries=$(awk -F: '$1 == "pub" || $1 == "sec"' <<<"$listing" | wc -l)
          [ "$primaries" -eq 1 ] || { echo "::error::the key file holds $primaries primary keys; the release key alone is expected"; exit 1; }
          ! awk -F: '$1 == "sec" || $1 == "ssb"' <<<"$listing" | grep -q . || { echo "::error::the key file holds a secret key"; exit 1; }
          actual=$(awk -F: '$1 == "fpr" { print toupper($10); exit }' <<<"$listing")
          [ "$actual" = "$expected" ] || { echo "::error::the primary key is $actual, not the release key $expected"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-arch
          path: ${{ github.workspace }}/iso-build/arch
      # packages.json must name this commit and exactly the packages beside it, by sha256.
      - name: The packages are this commit's
        run: |
          dir=iso-build/arch
          commit=$(git rev-parse HEAD)
          jq -e --arg commit "$commit" '.schema == 1 and .commit == $commit' "$dir/packages.json" >/dev/null \
            || { echo "::error::$dir/packages.json: the packages are not from $commit"; exit 1; }
          actual=$(cd "$dir" && sha256sum ./*.pkg.tar.zst | jq -Rn '[inputs | split("  ") | {(.[1] | ltrimstr("./")): .[0]}] | add')
          jq -e --argjson actual "$actual" '.files == $actual' "$dir/packages.json" >/dev/null \
            || { echo "::error::$dir/packages.json: package names or sha256 digests differ"; exit 1; }
          mkdir -p iso-build/pkgs
          cp "$dir"/*.pkg.tar.zst "$dir/packages.json" iso-build/pkgs/
          echo "reused $(ls "$dir"/*.pkg.tar.zst | wc -l) verified Arch packages from $commit"
      # The keyring package: the public key and the release key's trust line for pacman.
      - name: cupertino-keyring
        run: |
          install -d -o ci iso-build/keyring
          cp -r packaging/keyring/. iso-build/keyring/
          cp "$RUNNER_TEMP/PUBLIC.asc" iso-build/key.asc
          chown -R ci iso-build/keyring iso-build/key.asc
          runuser -u ci -- bash -c 'cd iso-build/keyring && CUPERTINO_KEYRING_KEY="$PWD/../key.asc" makepkg -f --nodeps'
          cp iso-build/keyring/cupertino-keyring-*-any.pkg.tar.zst iso-build/pkgs/
      - name: Build the ISO
        run: |
          work=$GITHUB_WORKSPACE/iso-build
          epoch=$(git log -1 --format=%ct HEAD)
          head=$(git rev-parse HEAD)
          cp -a packaging/iso "$work/profile"
          # Symlinks cannot live in the source tree; airootfs-links lists them as "path target" lines.
          while read -r link target; do
            mkdir -p "$work/profile/airootfs/$(dirname "$link")"
            ln -sfn "$target" "$work/profile/airootfs/$link"
          done < "$work/profile/airootfs-links"
          rm "$work/profile/airootfs-links"
          mkdir -p "$work/profile/airootfs/home/live"
          cp "$work/profile/pacman.conf" "$work/profile/airootfs/etc/pacman.conf"
          # The local repository: on the build host for mkarchiso's pacman, and in the image for the installed system.
          mkdir -p /opt/cupertino-repo "$work/profile/airootfs/opt/cupertino-repo"
          cp "$work/pkgs"/*.pkg.tar.zst /opt/cupertino-repo/
          cp "$work/pkgs"/*.pkg.tar.zst "$work/profile/airootfs/opt/cupertino-repo/"
          repo-add -q /opt/cupertino-repo/cupertino.db.tar.zst /opt/cupertino-repo/*.pkg.tar.zst
          cp /opt/cupertino-repo/cupertino.db.tar.zst /opt/cupertino-repo/cupertino.files.tar.zst "$work/profile/airootfs/opt/cupertino-repo/"
          ln -sf cupertino.db.tar.zst "$work/profile/airootfs/opt/cupertino-repo/cupertino.db"
          ln -sf cupertino.files.tar.zst "$work/profile/airootfs/opt/cupertino-repo/cupertino.files"
          pacman -Q archiso | tee "$work/archiso-version"
          SOURCE_DATE_EPOCH=$epoch mkarchiso -v -w "$work/iso-work" -o "$work/iso-out" "$work/profile"
          mkdir -p "$work/out"
          name=cupertino-$(date -u --date="@$epoch" +%Y.%m.%d)-${head:0:8}-x86_64.iso
          mv "$work"/iso-out/*.iso "$work/out/$name"
          (cd "$work/out" && sha256sum "$name" > "$name.sha256")
          {
            echo "head $head"
            echo "source-date-epoch $epoch"
            cat "$work/pkgs/packages.json"
            cat "$work/archiso-version"
            ls "$work/pkgs"
            echo "installed packages:"
            cat "$work/iso-work/iso/arch/pkglist.x86_64.txt"
          } > "$work/out/$name.manifest"
      - name: Summary
        run: ls -l --block-size=M -- iso-build/out/*.iso* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: |
            iso-build/out/*.iso
            iso-build/out/*.iso.sha256
            iso-build/out/*.iso.manifest
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
