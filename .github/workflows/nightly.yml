# Nightly: the full CI (every job, check also in the package build environment) and the Arch package build of the release
# (build, check(), manifest verification, namcap, install test in pinned containers), on main. Pull requests and pushes
# run the short CI only, so a failure that shows only here surfaces the next morning, not on a release tag. Nothing is
# published; the packages and logs are kept as workflow artifacts for a week.
#
# A night on which main has not changed since the last successful nightly runs nothing. Run it by hand to force a run.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          last=$(gh run list --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$EVENT" = workflow_dispatch ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is still at ${GITHUB_SHA:0:12}, which the last successful nightly built: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  arch:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report free disk space
        run: df -h / /mnt
      - name: Build, verify and install-test in the pinned Arch container
        run: bash packaging/ci/build-in-container.sh arch out/arch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-arch
          path: out/arch/*
          retention-days: 7
          if-no-files-found: ignore
