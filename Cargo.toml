[workspace]
resolver = "2"
members = ["crates/*"]
# A path dependency inside the workspace directory would become a member; the vendored crates are plain dependencies.
exclude = ["third-party/xkbcommon-rs", "third-party/smithay", "tools/gpu-probes"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
debug = "line-tables-only"

# The release build with full debug info and every symbol kept, for profilers: `cargo build --profile profiling`.
# Frame pointers cannot be set per profile on stable Cargo; add `RUSTFLAGS="-C force-frame-pointers=yes"` and a target
# folder of its own when a profiler needs them, so the release build in target/ is not rebuilt.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

# Dev builds optimise the crates where CPU drawing spends its time: the rasteriser, the font, SVG and PNG crates, and
# cupertino-ui-render's own shadow and blur loops. Unoptimised, a 2x frame or capture is several times slower; why each
# is listed is in CONTRIBUTING.md. Debug assertions and overflow checks stay as the dev profile sets them.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.cupertino-ui-render]
opt-level = 3
# The shared drawing maths every pixel test and model runs through.
[profile.dev.package.cupertino-raster-math]
opt-level = 3
# Our crates whose tests draw and compare whole frames (the glass model, the toolkit's layout and recording, the
# launcher's same-moment compositions): level 1 makes their loops several times faster and keeps an edit's rebuild
# quick.
[profile.dev.package.cupertino-glass]
opt-level = 1
[profile.dev.package.cupertino-ui-core]
opt-level = 1
[profile.dev.package.cupertino-ui-gpu]
opt-level = 1
[profile.dev.package.cupertino-launcher]
opt-level = 1
# Every other dependency: built once and kept, so optimising it costs nothing after the first build and speeds up
# everything that calls it in a test. The entries above for single dependencies still win.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Pure-Rust replacement for the C-binding crate of the same name (no libxkbcommon)
xkbcommon = { path = "crates/cupertino-xkbcommon" }
# The crates.io release 0.7.0, vendored with the server's fixes to it (third-party/smithay/CHANGELOG.md, Unreleased)
smithay = { path = "third-party/smithay" }
