[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
Output=guest
CompressOutput=no
RepartDirectories=repart.d

[Content]
Autologin=yes
KernelCommandLine=console=hvc0
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=none
Packages=systemd
         linux
         mesa
         dbus
         pam
         shadow
         openssh
         python
         libxkbcommon
         libinput
         libdisplay-info
         libxcb
         libx11
         fontconfig
         polkit
         grep
         procps-ng
         xorg-xwayland
         xwayland-satellite
         xterm
         xclip
         xsettingsd
         xorg-xrdb
         xorg-xwininfo
         ttf-dejavu

[Build]
ToolsTree=
Incremental=no
RepartOffline=yes
UseSubvolumes=no

[Runtime]
Register=no
VirtualMachineMonitor=qemu
RAM=2G
CPUs=2
Ephemeral=yes
