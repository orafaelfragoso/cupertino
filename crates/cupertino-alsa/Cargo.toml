[package]
name = "cupertino-alsa"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The kernel's sound control interface (/dev/snd/controlC*) without alsa-lib: card info, mixer elements, dB ranges from TLV data, change events, and the volume mapping onto 0 to 1"

[package.metadata.cupertino]
layer = "platform"

[dependencies]
rustix = { version = "1", features = ["fs"] }
