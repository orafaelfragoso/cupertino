[package]
name = "cupertino-animation"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Animation primitives for a Smithay compositor: reference spring, cubic-bezier timing functions, scroll momentum, rubber-band overscroll and retargetable animated values"
autotests = false

[package.metadata.cupertino]
layer = "foundation"

[lib]
test = false

[dependencies]

[[bench]]
name = "throughput"
harness = false

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
