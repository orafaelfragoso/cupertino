[package]
name = "cupertino-app-protocols"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Public Wayland protocols of the Cupertino server that any client may bind, with generated client and server bindings"

[package.metadata.cupertino]
layer = "protocol"

[lib]
test = false

[features]
client = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-scanner", "dep:bitflags"]
server = ["dep:wayland-server", "dep:wayland-backend", "dep:wayland-scanner", "dep:bitflags"]

[dependencies]
bitflags = { version = "2", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-scanner = { version = "0.31", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
