[package]
name = "cupertino-apps"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Application registry shared by the Cupertino processes: desktop entries and their Exec lines, launching with an activation token, the shared MIME database (globs, aliases, subclasses, icon names), default applications from mimeapps.list, and the recently-used files and the launcher's usage store"

[package.metadata.cupertino]
layer = "foundation"

[features]
default = []
# `activate`: `org.freedesktop.Application.Activate` on the session bus
dbus = ["dep:async-channel", "dep:async-io", "dep:zbus"]

[dependencies]
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[dev-dependencies]
tempfile = "3"
