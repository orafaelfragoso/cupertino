[package]
name = "cupertino-audiod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Session audio service for the default devices, volume, mute and stereo balance"

[package.metadata.cupertino]
layer = "services"

[[bin]]
name = "cupertino-audiod"
path = "src/main.rs"
test = false

[dependencies]
rustix = { version = "1", features = ["fs"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "audio-backend-stand-in"
path = "examples/audio-backend-stand-in.rs"
