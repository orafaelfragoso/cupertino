[package]
name = "cupertino-btd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bluetooth daemon for the system bus: adapter and device inventory over the kernel management interface, pairing with an agent the shell registers, and the org.cupertino.Bluetooth1 interface"

[package.metadata.cupertino]
layer = "services"

[features]
default = ["dbus"]
dbus = ["dep:zbus", "dep:cupertino-seat", "dep:async-channel", "dep:serde"]
# the `cupertino-btd` process
app = ["dbus"]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
async-channel = { version = "2", optional = true }
cupertino-bluetooth = { path = "../cupertino-bluetooth" }
cupertino-seat = { path = "../cupertino-seat", optional = true }
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1", features = ["derive"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"

[[bin]]
name = "cupertino-btd"
path = "src/main.rs"
required-features = ["app"]
