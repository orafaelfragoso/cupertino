[package]
name = "cupertino-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `cupertino` command: a typed registry of subcommands with help, version and human or JSON output"

[package.metadata.cupertino]
layer = "tools"

[lib]
name = "cupertino_cli"

[[bin]]
name = "cupertino"
path = "src/bin/cupertino.rs"

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
