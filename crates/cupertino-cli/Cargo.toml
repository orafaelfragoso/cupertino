[package]
name = "cupertino-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `cupertino` command: a typed registry of subcommands that the help, completions and manual pages come from, with human, JSON and JSON lines output"

[package.metadata.cupertino]
layer = "tools"

[lib]
name = "cupertino_cli"

[[bin]]
name = "cupertino"
path = "src/bin/cupertino.rs"

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-build-info = { path = "../cupertino-build-info" }
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-diagnostics = { path = "../cupertino-diagnostics" }
cupertino-layers = { path = "../cupertino-layers" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
