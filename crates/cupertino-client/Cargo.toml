[package]
name = "cupertino-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Client toolkit of the Cupertino shell processes: layer surfaces and popups with double-buffered shm drawing, buffer scale, outputs, pointer and key events, activation tokens, server-rendered backdrops and the menu bar and dock roles"

[package.metadata.cupertino]
layer = "render"

[dependencies]
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-protocol-app = { path = "../cupertino-protocol-app" }
cupertino-shell-client = { path = "../cupertino-shell-client" }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
tiny-skia = "0.11"
wayland-client = "0.31"

# the integration test runs a minimal protocol server in-process
[dev-dependencies]
cupertino-protocols = { path = "../cupertino-protocols", features = ["client", "server"] }
memmap2 = "0.9"
rustix = { version = "1", features = ["event", "fs"] }
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
wayland-server = "0.31"
