[package]
name = "cupertino-control-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure desktop-control grant lifecycle and input ownership, without transport or device I/O"
autotests = false
[package.metadata.cupertino]
layer = "models"

[lib]
test = false

[[test]]
