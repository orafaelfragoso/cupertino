[package]
name = "cupertino-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The native desktop controller: scoped session consent, input and capture over local Rust IPC"
autotests = false

[package.metadata.cupertino]
layer = "services"

[[bin]]
name = "cupertino-control"
path = "src/main.rs"
test = false

[dependencies]
cupertino-control-model = { path = "../cupertino-control-model" }
cupertino-app-protocols = { path = "../cupertino-app-protocols" }
cupertino-shell-client = { path = "../cupertino-shell-client" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
cupertino-peer = { path = "../cupertino-peer" }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
