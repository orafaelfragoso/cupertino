[package]
name = "cupertino-controlcenter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Control panel for the Cupertino compositor: module grid, toggles and sliders, open/close lifecycle, Wi-Fi, Bluetooth, brightness, volume and battery backends, org.cupertino.ControlPanel1 and the panel window on CupertinoKit"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
dbus = ["dep:zbus"]
# the `cupertino-controlcenter` process: the panel on a layer surface as a client of the server
app = [
    "dbus",
    "dep:async-channel",
    "dep:async-io",
    "dep:cupertino-kit",
    "dep:cupertino-modifiers",
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-theme",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
]

[dependencies]
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
cupertino-alsa = { path = "../cupertino-alsa" }
cupertino-pipewire = { path = "../cupertino-pipewire" }
cupertino-theme = { path = "../cupertino-theme", optional = true }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit", optional = true }
cupertino-modifiers = { path = "../cupertino-modifiers", optional = true }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[[bin]]
name = "cupertino-controlcenter"
path = "src/main.rs"
required-features = ["app"]

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
cupertino-pipewire = { path = "../cupertino-pipewire", features = ["fake"] }
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"
tiny-skia = "0.12"

[[test]]
name = "panel"
required-features = ["app"]
