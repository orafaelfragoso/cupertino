[package]
name = "cupertino-controlcenter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Control panel of the Cupertino shell, a component of the shell host: glass module tiles, toggles, sliders and detail views, open/close lifecycle, Wi-Fi, Bluetooth, microphone, dock, keyboard, focus, media, brightness and volume through the services that own them, and org.cupertino.ControlPanel1"
[package.metadata.cupertino]
layer = "shell"

[lib]
test = false

[dependencies]
async-channel = "2"
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-radios = { path = "../cupertino-radios", features = ["dbus"] }
serde = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }
