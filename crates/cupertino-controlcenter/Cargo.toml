[package]
name = "cupertino-controlcenter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Control panel for the Cupertino compositor: module grid, toggles and sliders, open/close lifecycle, Wi-Fi, Bluetooth, brightness, volume and battery backends, org.cupertino.ControlPanel1 and CPU rendering"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
dbus = ["dep:zbus"]
# the `cupertino-controlcenter` process: the panel on a layer surface as a client of the server
app = [
    "dbus",
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
]

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-alsa = { path = "../cupertino-alsa" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
tiny-skia = "0.11"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[[bin]]
name = "cupertino-controlcenter"
path = "src/main.rs"
required-features = ["app"]

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
