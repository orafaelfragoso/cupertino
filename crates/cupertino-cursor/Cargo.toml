[package]
name = "cupertino-cursor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Builds XCursor themes (and optional hyprcursor source themes) from per-cursor vector PDFs with metadata, or from a built-in procedural cursor set"

[package.metadata.cupertino]
layer = "render"

[lib]
name = "cupertino_cursor"

[[bin]]
name = "cupertino-cursor"
path = "src/bin/cupertino-cursor.rs"

[dependencies]
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
