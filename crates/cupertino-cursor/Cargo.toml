[package]
name = "cupertino-cursor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Builds XCursor themes (and optional hyprcursor source themes) from a built-in procedural cursor set"
autotests = false

[package.metadata.cupertino]
layer = "render"

[lib]
name = "cupertino_cursor"
test = false

[[bin]]
name = "cupertino-cursor"
path = "src/bin/cupertino-cursor.rs"
test = false

[dependencies]
tiny-skia = "0.12"

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
