[package]
name = "cupertino-defaults"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Settings store shared by the Cupertino processes: where each settings file lives (environment override, else the XDG configuration directory), typed read and atomic write of the files, change notification"

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
libc = "0.2"
inotify = { version = "0.11", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

