[package]
name = "cupertino-devices"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Device discovery without libudev: sysfs enumeration, input classification, primary GPU and a kernel uevent hotplug monitor"

[package.metadata.cupertino]
layer = "platform"

[dependencies]
cupertino-evdev = { path = "../cupertino-evdev" }
rustix = { version = "1", features = ["fs", "net"] }
