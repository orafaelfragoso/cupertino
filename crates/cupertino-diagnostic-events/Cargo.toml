[package]
name = "cupertino-diagnostic-events"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Diagnostics of every Cupertino process: versioned diagnostic events (the event model, redaction, a bounded store, a memory ring and a journald sink), what the build is and runs on, and frame timelines when CUPERTINO_PROFILE asks"
build = "build.rs"
[package.metadata.cupertino]
layer = "system"

[lib]
name = "cupertino_diagnostic_events"

[features]
# The Tracy client. It takes effect only with `--cfg cupertino_tracy` as well (see the README), so `--all-features`, which
# every package and CI build uses, never compiles it in.
tracy = ["dep:tracing-tracy"]

[dependencies]
libc = "0.2"
rustix = { version = "1", features = ["thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[target.'cfg(cupertino_tracy)'.dependencies]
# collecting only while a profiler is connected, reachable from this machine alone; without the client's own handlers
# of fatal signals, which would take the server's place
tracing-tracy = { version = "0.12", optional = true, default-features = false, features = [
    "enable",
    "ondemand",
    "broadcast",
    "only-localhost",
] }

[lints.rust]
# `--cfg cupertino_tracy` is set only by a build that asks for the Tracy client (see the README); no cargo feature sets it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cupertino_tracy)'] }
