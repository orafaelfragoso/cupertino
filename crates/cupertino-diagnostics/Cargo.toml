[package]
name = "cupertino-diagnostics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Typed diagnostics of a Cupertino installation and session (GPU and driver, session, portals, services, the last crash, logs), as text or JSON"

[package.metadata.cupertino]
layer = "tools"

[lib]
name = "cupertino_diagnostics"

[[bin]]
name = "cupertino-diagnose"
path = "src/bin/cupertino-diagnose.rs"

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-devices = { path = "../cupertino-devices" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
