[package]
name = "cupertino-dock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Dock for the Cupertino desktop: tiles, layout, magnification, bounce animations, hit-testing, drag-reorder and auto-hide, the window feed and `dock.conf`, and the `cupertino-dock` process"

[package.metadata.cupertino]
layer = "shell"

[features]
# the `cupertino-dock` process: the bar on a layer surface as a client of the server
app = [
    "dep:cupertino-apps",
    "dep:cupertino-assets",
    "dep:cupertino-decorations",
    "dep:cupertino-geometry",
    "dep:cupertino-icons",
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-theme",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:tiny-skia",
]

[dependencies]
cupertino-animation = { path = "../cupertino-animation" }
cupertino-overview = { path = "../cupertino-overview" }
cupertino-wm = { path = "../cupertino-wm" }
cupertino-apps = { path = "../cupertino-apps", optional = true }
cupertino-assets = { path = "../cupertino-assets", optional = true }
cupertino-decorations = { path = "../cupertino-decorations", optional = true }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry", optional = true }
cupertino-icons = { path = "../cupertino-icons", optional = true }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-theme = { path = "../cupertino-theme", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
tiny-skia = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
# `--cfg cupertino_capture_fixtures` is set only by `capture.sh` (see the README); no cargo feature enables it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cupertino_capture_fixtures)'] }

[[bin]]
name = "cupertino-dock"
path = "src/main.rs"
required-features = ["app"]
