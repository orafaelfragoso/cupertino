[package]
name = "cupertino-dock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Dock for the Cupertino desktop as a component of the shell host: tiles, layout, magnification, bounce animations, hit-testing, drag-reorder and auto-hide, the window feed, the application switcher's panel, the Force Quit dialog and `dock.conf`"
[package.metadata.cupertino]
layer = "shell"

[dependencies]
async-channel = "2"
async-io = "2"
cupertino-animation = { path = "../cupertino-animation" }
cupertino-apps = { path = "../cupertino-apps", features = ["dbus"] }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-trash = { path = "../cupertino-trash" }
cupertino-wm = { path = "../cupertino-wm" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "8"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }

[[example]]
name = "dock_capture"
