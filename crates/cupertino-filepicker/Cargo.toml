[package]
name = "cupertino-filepicker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The model of a file chooser: a folder's entries, the highlighted one, navigation, filters and type-to-select, with no drawing"

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
cupertino-typeahead = { path = "../cupertino-typeahead" }

[dev-dependencies]
tempfile = "3"
