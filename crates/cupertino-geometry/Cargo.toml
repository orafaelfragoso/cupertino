[package]
name = "cupertino-geometry"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Dependency-free 2D geometry for the Cupertino compositor: rects, continuous-corner rounded rectangles (path, signed distance, coverage), nine-slice math and shadow kernel helpers"
autotests = false

[package.metadata.cupertino]
layer = "foundation"

[lib]
test = false

[dependencies]

[[bench]]
name = "geometry"
harness = false

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
