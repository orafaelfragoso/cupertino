[package]
name = "cupertino-glass"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Material rendering for the Cupertino compositor: backdrop blur, colour filter chains, fill layers, glass and vibrant blending from the specification recipes, its programs written once in WGSL, a headless renderer on cupertino-gpu and a CPU reference"
autotests = false

[package.metadata.cupertino]
layer = "render"

[lib]
name = "cupertino_glass"

[[bin]]
name = "glass-renderer"
path = "src/bin/glass_renderer.rs"

[dependencies]
cupertino-theme = { path = "../cupertino-theme" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-raster-math = { path = "../cupertino-raster-math" }
cupertino-gpu = { path = "../cupertino-gpu" }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
