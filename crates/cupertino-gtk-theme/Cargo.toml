[package]
name = "cupertino-gtk-theme"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Generator for GTK 3, GTK 4 / libadwaita and Qt colour schemes plus a fontconfig snippet from the Cupertino design tokens"

[package.metadata.cupertino]
layer = "tools"

[lib]
name = "cupertino_gtk_theme"

[[bin]]
name = "cupertino-gtk-theme"
path = "src/bin/cupertino-gtk-theme.rs"

[dependencies]
cupertino-input = { path = "../cupertino-input" }
cupertino-theme = { path = "../cupertino-theme" }

[dev-dependencies]
tempfile = "3"
