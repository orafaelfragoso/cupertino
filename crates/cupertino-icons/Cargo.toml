[package]
name = "cupertino-icons"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "System icons by semantic name from the asset directory (rasters, tinted template symbols, file icons by type), and applications' own icons from an absolute path or the hicolor theme; PNG/SVG loading into premultiplied pixels, shared by the server and the shell processes; the freedesktop.org thumbnail cache"
autotests = false

[package.metadata.cupertino]
layer = "system"

[lib]
test = false

[dependencies]
cupertino-apps = { path = "../cupertino-apps" }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
md5 = "0.8"
percent-encoding = "2"
png = "0.18"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
rustix = { version = "1", features = ["fs"] }
tiny-skia = "0.12"

[dev-dependencies]
tempfile = "3"

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
