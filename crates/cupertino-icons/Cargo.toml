[package]
name = "cupertino-icons"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "System icons by semantic name from the asset directory (rasters, tinted template symbols, file icons by type), and applications' own icons from an absolute path or the hicolor theme; PNG/SVG loading into premultiplied pixels, shared by the server and the shell processes"

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
cupertino-apps = { path = "../cupertino-apps" }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
tiny-skia = "0.12"

[dev-dependencies]
tempfile = "3"
