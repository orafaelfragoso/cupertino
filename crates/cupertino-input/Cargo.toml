[package]
name = "cupertino-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Input model for the Cupertino compositor: touchpad gesture recognition, hot corners, screen-edge dwell, shortcut maps and kinetic scrolling"
autotests = false
[package.metadata.cupertino]
layer = "models"

[lib]
test = false

[dependencies]
cupertino-animation = { path = "../cupertino-animation" }
cupertino-keyboard = { path = "../cupertino-keyboard" }

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
