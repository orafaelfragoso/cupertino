[package]
name = "cupertino-keyboard"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Keyboard model for the Cupertino compositor: key repeat, modifier profiles, text-editing bindings, desktop shortcuts, accent picker, input-source switcher and an XKB keymap generator"
autotests = false

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-key-bindings = { path = "../cupertino-key-bindings" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "suite"
path = "tests/suite.rs"
