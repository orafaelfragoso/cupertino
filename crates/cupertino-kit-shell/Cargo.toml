[package]
name = "cupertino-kit-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shell's extension to CupertinoKit"

[package.metadata.cupertino]
layer = "shellkit"

[dependencies]
cupertino-kit = { path = "../cupertino-kit" }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-protocols = { path = "../cupertino-protocols", features = ["client"] }
cupertino-shell-client = { path = "../cupertino-shell-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
wayland-client = "0.31"
zbus = { version = "5", default-features = false, features = ["async-io"] }
