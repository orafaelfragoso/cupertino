[package]
name = "cupertino-kit-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shell's extension to CupertinoKit"

[package.metadata.cupertino]
layer = "shellkit"

[dependencies]
cupertino-shell-client = { path = "../cupertino-shell-client" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
