[package]
name = "cupertino-kit-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shell's extension to CupertinoKit"

[package.metadata.cupertino]
layer = "shellkit"

[lib]
test = false

[dependencies]
async-io = "2"
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-protocols = { path = "../cupertino-protocols", features = ["client"] }
cupertino-shell-client = { path = "../cupertino-shell-client" }
cupertino-keyboard = { path = "../cupertino-keyboard" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
rustix = { version = "1", features = ["event", "fs", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
# the stand-in server's side of the host protocol, which the hosting tests run against
cupertino-protocols = { path = "../cupertino-protocols", features = ["client", "server"] }
wayland-protocols = { version = "0.32", features = ["client", "server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
# the relay between a component and the stand-in passes file descriptors
rustix = { version = "1", features = ["net"] }
wayland-server = "0.31"
