[package]
name = "cupertino-kit"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit, the Cupertino UI toolkit: the one crate applications depend on"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-apps = { path = "../cupertino-apps" }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-atspi = { path = "../cupertino-ui-atspi" }
cupertino-ui-controls = { path = "../cupertino-ui-controls" }
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-layout = { path = "../cupertino-ui-layout" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-ui-theme = { path = "../cupertino-ui-theme" }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland" }

[dev-dependencies]
tempfile = "3"
cupertino-capture = { path = "../cupertino-capture" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
tiny-skia = "0.12"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
