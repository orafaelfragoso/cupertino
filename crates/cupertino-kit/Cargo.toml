[package]
name = "cupertino-kit"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit, the Cupertino UI toolkit: the one crate applications depend on"
[package.metadata.cupertino]
layer = "ui"

[features]
# `cupertino_kit::test`, the headless backend for program tests; enabled only in dev-dependencies
test = ["dep:cupertino-ui-test", "dep:tiny-skia"]

[dependencies]
cupertino-animation = { path = "../cupertino-animation" }
cupertino-apps = { path = "../cupertino-apps" }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-keyboard = { path = "../cupertino-keyboard" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-controls = { path = "../cupertino-ui-controls" }
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-files = { path = "../cupertino-ui-files" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-ui-test = { path = "../cupertino-ui-test", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland" }
tiny-skia = { version = "0.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
rustix = { version = "1", features = ["process", "system"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
tiny-skia = "0.12"
# the transport's in-process protocol server, which the submitted-frame tests draw on
cupertino-app-protocols = { path = "../cupertino-app-protocols", features = ["client", "server"] }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
rustix = { version = "1", features = ["event"] }
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-server = "0.31"

[[example]]
name = "kit_capture"
required-features = ["test"]

[[test]]
name = "bus"
required-features = ["test"]

[[test]]
name = "children"
required-features = ["test"]

[[test]]
name = "frame-away"
required-features = ["test"]

[[test]]
name = "submitted-panic"
required-features = ["test"]

[[test]]
name = "suspended-in-flight"
required-features = ["test"]

[[test]]
name = "task"
required-features = ["test"]

[[test]]
name = "two-instances"
required-features = ["test"]

[[test]]
name = "picture"
required-features = ["test"]

[[test]]
name = "layers-handed-over"
required-features = ["test"]

[[test]]
name = "capture"
required-features = ["test"]

[[test]]
name = "preferences"
required-features = ["test"]

[[test]]
name = "settings"
required-features = ["test"]

[[test]]
name = "clipboard"
required-features = ["test"]
