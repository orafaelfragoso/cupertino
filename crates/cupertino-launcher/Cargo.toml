[package]
name = "cupertino-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Launcher (search panel) for the Cupertino compositor: desktop entry indexing, fuzzy matching with frecency, calculator, bounded file search, keyboard navigation and the panel window on CupertinoKit"
autotests = false

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
# the `cupertino-launcher` process: the panel on a layer surface as a client of the server
app = [
    "dep:async-channel",
    "dep:async-io",
    "cupertino-apps/dbus",
    "dep:cupertino-assets",
    "dep:cupertino-icons",
    "dep:cupertino-modifiers",
    "dep:cupertino-peer",
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-thumbnails",
    "dep:cupertino-wayland-client",
    "dep:libc",
    "dep:zbus",
]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
cupertino-apps = { path = "../cupertino-apps" }
cupertino-animation = { path = "../cupertino-animation" }
cupertino-assets = { path = "../cupertino-assets", optional = true }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-icons = { path = "../cupertino-icons", optional = true }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-modifiers = { path = "../cupertino-modifiers", optional = true }
cupertino-peer = { path = "../cupertino-peer", optional = true }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-thumbnails = { path = "../cupertino-thumbnails", optional = true }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
libc = { version = "0.2", optional = true }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[dev-dependencies]
async-channel = "2"
cupertino-assets = { path = "../cupertino-assets" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
tempfile = "3"

[[bin]]
name = "cupertino-launcher"
path = "src/main.rs"
required-features = ["app"]

[[example]]
name = "search"

[[bench]]
name = "matching"
harness = false

[[test]]
name = "suite"
path = "tests/suite.rs"
