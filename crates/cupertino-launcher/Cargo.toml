[package]
name = "cupertino-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Launcher (search panel) model for the Cupertino compositor: desktop entry indexing, fuzzy matching with frecency, calculator, bounded file search, keyboard navigation and CPU panel rendering"

[package.metadata.cupertino]
layer = "shell"

[features]
default = ["material"]
material = ["dep:cupertino-glass", "dep:image"]
# the `cupertino-launcher` process: the panel on a layer surface as a client of the server
app = [
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:zbus",
]

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-apps = { path = "../cupertino-apps" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-animation = { path = "../cupertino-animation" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-keyboard = { path = "../cupertino-keyboard" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
cupertino-glass = { path = "../cupertino-glass", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde_json = "1"
tiny-skia = "0.11"
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"

[[bin]]
name = "cupertino-launcher"
path = "src/main.rs"
required-features = ["app"]

[[example]]
name = "launcher_samples"

[[example]]
name = "search"

[[bench]]
name = "matching"
harness = false
