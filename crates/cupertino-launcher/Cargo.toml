[package]
name = "cupertino-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Launcher (search panel) for the Cupertino compositor: desktop entry indexing, fuzzy matching with frecency, calculator, bounded file search, keyboard navigation and the panel window on CupertinoKit"
[package.metadata.cupertino]
layer = "shell"

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
async-channel = "2"
cupertino-apps = { path = "../cupertino-apps", features = ["dbus", "watch"] }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
libc = "0.2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }
gungraun = "=0.20.0"

[[example]]
name = "search"

[[example]]
name = "launcher_capture"

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "instructions"
harness = false
