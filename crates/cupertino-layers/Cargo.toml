[package]
name = "cupertino-layers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Checks that workspace crates follow the layer rules: the layer table, the further rules, the facades and the external crates"
[package.metadata.cupertino]
layer = "tools"

[lib]
name = "cupertino_layers"

[[bin]]
name = "cupertino-layers"
path = "src/bin/cupertino-layers.rs"

[dependencies]
serde_json = "1"
spdx = "0.13.6"
