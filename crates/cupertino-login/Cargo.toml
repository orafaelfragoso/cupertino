[package]
name = "cupertino-login"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Lock screen, greeter and session agent for the Cupertino compositor: password entry state machine, clock and user block, wallpaper treatment, PAM authentication for the lock screen, the connection to the session manager, confirmation panels, org.cupertino.Login1 and CPU rendering"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
dbus = ["dep:zbus", "dep:cupertino-seat"]
# the `cupertino-login` process: the lock screen, greeter and session agent as a client of the server
app = [
    "dbus",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:pam-client2",
]

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-login-ipc = { path = "../cupertino-login-ipc" }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-seat = { path = "../cupertino-seat", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
libc = "0.2"
pam-client2 = { version = "0.5.5", optional = true }
tiny-skia = "0.11"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cupertino-login"
path = "src/main.rs"
required-features = ["app"]
