[package]
name = "cupertino-login"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Lock screen and greeter for the Cupertino compositor: password entry state machine, clock and user block, wallpaper treatment, PAM authentication for the lock screen, the connection to the session manager, the desktop-control consent panel and org.cupertino.Login1, drawn with CupertinoKit"
[package.metadata.cupertino]
layer = "shell"

[features]
default = []
dbus = ["dep:zbus", "dep:cupertino-seat", "dep:cupertino-radios", "dep:cupertino-peer"]
# the `cupertino-login` process: the lock screen and greeter as a client of the server
app = [
    "dbus",
    "dep:async-channel",
    "dep:async-io",
    "dep:cupertino-assets",
    "dep:cupertino-icons",
    "dep:cupertino-keyboard",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:pam-client2",
]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
cupertino-assets = { path = "../cupertino-assets", optional = true }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-icons = { path = "../cupertino-icons", optional = true }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-login-ipc = { path = "../cupertino-login-ipc" }
cupertino-keyboard = { path = "../cupertino-keyboard", optional = true }
cupertino-peer = { path = "../cupertino-peer", optional = true }
cupertino-raster-math = { path = "../cupertino-raster-math" }
cupertino-radios = { path = "../cupertino-radios", features = ["dbus"], optional = true }
cupertino-seat = { path = "../cupertino-seat", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
pam-client2 = { version = "0.5.5", optional = true }
tiny-skia = "0.12"
unicode-segmentation = "1.13"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
zeroize = "1"

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }
gungraun = "=0.20.0"

[[bench]]
name = "instructions"
harness = false

[[bin]]
name = "cupertino-login"
path = "src/main.rs"
required-features = ["app"]
