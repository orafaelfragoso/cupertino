[package]
name = "cupertino-login"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Lock screen, greeter and session agent for the Cupertino compositor: password entry state machine, clock and user block, wallpaper treatment, PAM authentication for the lock screen, the connection to the session manager, confirmation panels and org.cupertino.Login1, drawn with CupertinoKit"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
dbus = ["dep:zbus", "dep:cupertino-seat"]
# the `cupertino-login` process: the lock screen, greeter and session agent as a client of the server
app = [
    "dbus",
    "dep:async-channel",
    "dep:async-io",
    "dep:cupertino-modifiers",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:pam-client2",
]

[dependencies]
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
cupertino-apps = { path = "../cupertino-apps" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-login-ipc = { path = "../cupertino-login-ipc" }
cupertino-modifiers = { path = "../cupertino-modifiers", optional = true }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-seat = { path = "../cupertino-seat", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
libc = "0.2"
pam-client2 = { version = "0.5.5", optional = true }
tiny-skia = "0.12"
unicode-segmentation = "1.13"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
zeroize = "1"

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-test-pam = { path = "../cupertino-test-pam" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-atspi = { path = "../cupertino-ui-atspi" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
tempfile = "3"

[[bin]]
name = "cupertino-login"
path = "src/main.rs"
required-features = ["app"]

[[test]]
name = "harden"
required-features = ["app"]

[[test]]
name = "pam"
required-features = ["app"]
