[package]
name = "cupertino-menu-model"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Typed application menus shared by CupertinoKit and the menu bar: logical chords and their accelerator text, command roles and action names, the menu tree and the standard menus"
autotests = false

[package.metadata.cupertino]
layer = "foundation"

[lib]
test = false

[dependencies]
cupertino-keyboard = { path = "../cupertino-keyboard" }

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
