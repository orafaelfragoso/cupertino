[package]
name = "cupertino-menubar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Menu bar for the Cupertino desktop: menu model and layout, interaction state machine, a D-Bus layer (DBusMenu, status notifier items, GMenuModel) and the menu bar component of the shell host"
autotests = false
[package.metadata.cupertino]
layer = "shell"

[lib]
test = false

[dependencies]
cupertino-apps = { path = "../cupertino-apps" }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-menu-model = { path = "../cupertino-menu-model" }
cupertino-keyboard = { path = "../cupertino-keyboard" }
cupertino-radios = { path = "../cupertino-radios", features = ["dbus"] }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
zeroize = "1"
async-channel = "2"
async-io = "2"
x11rb = { version = "0.13", default-features = false }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }

[[example]]
name = "menubar_capture"

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
