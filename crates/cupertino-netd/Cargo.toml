[package]
name = "cupertino-netd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Network daemon for the system bus: links, DHCPv4, DNS, Wi-Fi through iwd, the org.freedesktop.NetworkManager subset apps poll, and the network service at org.cupertino.Network1"

[package.metadata.cupertino]
layer = "services"

[features]
default = ["dbus"]
dbus = ["dep:zbus", "dep:cupertino-seat", "dep:async-channel", "dep:cupertino-peer"]
# the `cupertino-netd` process
app = ["dbus"]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
async-channel = { version = "2", optional = true }
cupertino-netlink = { path = "../cupertino-netlink" }
cupertino-peer = { path = "../cupertino-peer", optional = true }
cupertino-seat = { path = "../cupertino-seat", optional = true }
rustix = { version = "1", features = ["event", "fs", "net", "rand"] }
tempfile = "3"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
zeroize = "1"

[[bin]]
name = "cupertino-netd"
path = "src/main.rs"
required-features = ["app"]

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"
