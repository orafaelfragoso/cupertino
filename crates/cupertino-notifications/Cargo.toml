[package]
name = "cupertino-notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Banners and notification list of the Cupertino desktop, a component of the shell host: the notification model (banner stack, grouping, history, do not disturb), org.freedesktop.Notifications and org.cupertino.NotificationCenter1, the list kept across a restart, and the windows on CupertinoKit"
[package.metadata.cupertino]
layer = "shell"

[lib]
test = false

[dependencies]
async-channel = "2"
cupertino-apps = { path = "../cupertino-apps" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-peer = { path = "../cupertino-peer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }

[[example]]
name = "notifications_capture"
