[package]
name = "cupertino-notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Notification daemon model for the Cupertino compositor: org.freedesktop.Notifications server, banner stack with spring animation, grouping, history, do-not-disturb and CPU banner rendering"

[package.metadata.cupertino]
layer = "shell"

[features]
default = ["dbus", "material"]
dbus = ["dep:zbus", "dep:libc"]
material = ["dep:cupertino-glass", "dep:image"]
# the `cupertino-notifications` process: banners and the notification centre list as a client of the server
app = [
    "dbus",
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
]

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-animation = { path = "../cupertino-animation" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
cupertino-glass = { path = "../cupertino-glass", optional = true }
libc = { version = "0.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tiny-skia = "0.11"
zbus = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cupertino-notifications"
path = "src/main.rs"
required-features = ["app"]

[[example]]
name = "notifications_samples"

[[example]]
name = "notification-daemon"
path = "examples/daemon.rs"
required-features = ["dbus"]
