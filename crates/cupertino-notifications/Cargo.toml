[package]
name = "cupertino-notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Notification daemon model for the Cupertino compositor: org.freedesktop.Notifications server, banner stack with spring animation, grouping, history, do-not-disturb, and the banners and notification centre on CupertinoKit"

[package.metadata.cupertino]
layer = "shell"

[features]
default = ["dbus"]
dbus = ["dep:zbus", "dep:libc", "dep:cupertino-peer"]
# the `cupertino-notifications` process: the banners and the notification centre on CupertinoKit layer surfaces
app = [
    "dbus",
    "dep:async-channel",
    "dep:async-io",
    "dep:cupertino-modifiers",
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
cupertino-animation = { path = "../cupertino-animation" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-modifiers = { path = "../cupertino-modifiers", optional = true }
cupertino-peer = { path = "../cupertino-peer", optional = true }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
libc = { version = "0.2", optional = true }
unicode-segmentation = "1.13"
zbus = { version = "5", optional = true }

[dev-dependencies]
async-channel = "2"
cupertino-assets = { path = "../cupertino-assets" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"
futures-lite = "2"
zbus = { version = "5", features = ["p2p"] }

[[bin]]
name = "cupertino-notifications"
path = "src/main.rs"
required-features = ["app"]

[[example]]
name = "notification-daemon"
path = "examples/daemon.rs"
required-features = ["dbus"]
