[package]
name = "cupertino-osd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Volume, brightness and keyboard-backlight overlay for the Cupertino compositor: show/hold/fade model, segmented meter, ALSA and backlight effects, org.cupertino.Osd1 and the overlay window on CupertinoKit"
[package.metadata.cupertino]
layer = "shell"

[features]
default = []
dbus = ["dep:zbus"]
# the `cupertino-osd` process: the overlay on a layer surface as a client of the server
app = [
    "dbus",
    "dep:async-channel",
    "dep:async-io",
    "dep:cupertino-kit",
    "dep:cupertino-keyboard",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:cupertino-diagnostic-events",
    "dep:cupertino-peer",
]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events", optional = true }
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
cupertino-alsa = { path = "../cupertino-alsa" }
cupertino-peer = { path = "../cupertino-peer", optional = true }
cupertino-pipewire = { path = "../cupertino-pipewire" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit", optional = true }
cupertino-keyboard = { path = "../cupertino-keyboard", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[[bin]]
name = "cupertino-osd"
path = "src/main.rs"
required-features = ["app"]
