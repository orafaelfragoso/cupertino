[package]
name = "cupertino-pipewire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The volume and mute state of the default PipeWire sink and source, read and changed through WirePlumber's wpctl"

[package.metadata.cupertino]
layer = "platform"

[features]
default = []
# `fake::FakeWpctl`, a stand-in wpctl for the tests of the crates that use this one
fake = ["dep:tempfile"]

[dependencies]
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
