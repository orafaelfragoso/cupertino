[package]
name = "cupertino-polkit-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "polkit authentication agent of the session: answers polkitd for other software's actions with a Cupertino prompt and polkit's own helper"
autotests = false

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
# the `cupertino-polkit-agent` and `cupertino-keyring-prompter` processes
app = [
    "dep:cupertino-protocol-app",
    "dep:cupertino-shell-client",
    "dep:cupertino-ui-atspi",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-atspi = { path = "../cupertino-ui-atspi", optional = true }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
aes = "0.8"
async-channel = "2"
cbc = { version = "0.1", features = ["alloc"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["zeroize"] }
hkdf = "0.12"
libc = "0.2"
tiny-skia = "0.12"
sha2 = "0.11"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1"

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
tempfile = "3"

[[bin]]
name = "cupertino-polkit-agent"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "cupertino-keyring-prompter"
path = "src/keyring_main.rs"
required-features = ["app"]

[[test]]
name = "suite"
path = "tests/suite.rs"
