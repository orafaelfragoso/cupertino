[package]
name = "cupertino-polkit-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "polkit authentication agent of the session: answers polkitd for other software's actions with a Cupertino prompt and polkit's own helper"

[package.metadata.cupertino]
layer = "services"

[dependencies]
async-channel = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1"

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"
