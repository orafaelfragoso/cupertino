[package]
name = "cupertino-portal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "xdg-desktop-portal backend of the session: the appearance settings and the file chooser applications reach through the portal"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
# the `cupertino-portal` process
app = ["dep:cupertino-kit", "dep:cupertino-protocol-app", "dep:cupertino-wayland-client"]

[dependencies]
async-channel = "2"
cupertino-filepicker = { path = "../cupertino-filepicker" }
cupertino-kit = { path = "../cupertino-kit", optional = true }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
futures-lite = "2"
mime_guess = "2"
percent-encoding = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
tempfile = "3"

[[bin]]
name = "cupertino-portal"
path = "src/main.rs"
required-features = ["app"]
