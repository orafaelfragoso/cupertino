[package]
name = "cupertino-portal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "xdg-desktop-portal backend of the session: the appearance settings, the file chooser, the app chooser, screen sharing and screenshots applications reach through the portal"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
# the `cupertino-portal` process
app = ["dep:cupertino-assets", "dep:cupertino-icons", "dep:cupertino-kit", "dep:cupertino-protocol-app", "dep:cupertino-screencast", "dep:cupertino-wayland-client", "dep:rustix", "dep:wayland-client", "dep:wayland-protocols"]

[dependencies]
async-channel = "2"
cupertino-apps = { path = "../cupertino-apps" }
cupertino-assets = { path = "../cupertino-assets", optional = true }
cupertino-filepicker = { path = "../cupertino-filepicker" }
cupertino-icons = { path = "../cupertino-icons", optional = true }
cupertino-kit = { path = "../cupertino-kit", optional = true }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-screencast = { path = "../cupertino-screencast", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
futures-lite = "2"
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
rustix = { version = "1", features = ["fs", "time"], optional = true }
tiny-skia = "0.12"
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
tempfile = "3"

[[bin]]
name = "cupertino-portal"
path = "src/main.rs"
required-features = ["app"]
