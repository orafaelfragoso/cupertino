[package]
name = "cupertino-protocol-app"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "The public Cupertino protocols on the transport's queue: appearance and display options, server-rendered backdrops, the title bar style, scroll counts and layers the server animates"
autotests = false

[package.metadata.cupertino]
layer = "transport"

[dependencies]
cupertino-animation = { path = "../cupertino-animation" }
cupertino-semantics = { path = "../cupertino-semantics" }
cupertino-app-protocols = { path = "../cupertino-app-protocols", features = ["client"] }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
wayland-client = "0.31"

# the integration test runs a minimal protocol server in-process
[dev-dependencies]
cupertino-app-protocols = { path = "../cupertino-app-protocols", features = ["client", "server"] }
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }
wayland-server = "0.31"

[[test]]
name = "suite"
path = "tests/suite.rs"
