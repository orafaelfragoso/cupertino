[package]
name = "cupertino-protocol-app"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "The public Cupertino protocols on the transport's queue: appearance and display options, server-rendered backdrops, the title bar style and scroll counts"

[package.metadata.cupertino]
layer = "render"

[dependencies]
cupertino-app-protocols = { path = "../cupertino-app-protocols", features = ["client"] }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
wayland-client = "0.31"
