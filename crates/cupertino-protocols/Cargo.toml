[package]
name = "cupertino-protocols"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Private Wayland protocols between the Cupertino server and its shell processes, with generated client and server bindings"

[package.metadata.cupertino]
layer = "render"

[features]
client = ["dep:wayland-client"]
server = ["dep:wayland-server"]

[dependencies]
bitflags = "2"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }
