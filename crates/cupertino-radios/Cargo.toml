[package]
name = "cupertino-radios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Wi-Fi and Bluetooth radios through whichever service owns them: the Cupertino network and Bluetooth daemons, else NetworkManager and BlueZ, found, read, changed and followed the same way by Settings, the control panel and the menu bar"

[package.metadata.cupertino]
layer = "foundation"

[features]
default = []
# the services over the system bus; without it only the readings' types
dbus = ["dep:async-io", "dep:zbus"]

[dependencies]
async-io = { version = "2", optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
