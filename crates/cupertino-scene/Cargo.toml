[package]
name = "cupertino-scene"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Renderer-neutral per-output scene commands, desktop drawing order and the renderer trait that draws them"
autotests = false

[package.metadata.cupertino]
layer = "models"

[lib]
test = false

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-effects = { path = "../cupertino-effects" }

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
