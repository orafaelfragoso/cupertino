[package]
name = "cupertino-screenshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Screenshot tool of the Cupertino desktop: full-screen, window and selection capture with the crosshair overlay, the toolbar, the floating thumbnail, timestamped PNG files and the clipboard, a CupertinoKit program on cupertino-kit-shell"
[package.metadata.cupertino]
layer = "shell"

[dependencies]
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }

[[example]]
name = "screenshot_capture"

[[bin]]
name = "cupertino-screenshot"
path = "src/main.rs"
