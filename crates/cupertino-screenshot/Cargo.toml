[package]
name = "cupertino-screenshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Screenshot tool of the Cupertino compositor: full-screen, window and selection capture with the crosshair overlay, the toolbar, the floating thumbnail, timestamped PNG files and the clipboard"

[package.metadata.cupertino]
layer = "shell"

[features]
default = []
# the `cupertino-screenshot` process: the overlay, toolbar and thumbnail on layer surfaces and the capture through
# ext-image-copy-capture, as a client the server starts on a connection of its own
app = ["dep:cupertino-protocol-app", "dep:cupertino-shell-client", "dep:cupertino-ui-wayland", "dep:cupertino-wayland-client", "dep:cupertino-protocols", "dep:wayland-client", "dep:wayland-protocols", "dep:rustix", "dep:memmap2", "dep:libc"]

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-animation = { path = "../cupertino-animation" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-theme = { path = "../cupertino-theme" }
tiny-skia = "0.11"
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-protocols = { path = "../cupertino-protocols", features = ["client"], optional = true }
cupertino-shell-client = { path = "../cupertino-shell-client", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
libc = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
rustix = { version = "1", features = ["fs"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }

[[bin]]
name = "cupertino-screenshot"
path = "src/main.rs"
required-features = ["app"]
