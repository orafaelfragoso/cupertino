[package]
name = "cupertino-semantics"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Bounded native semantic snapshots, actions and sealed Wayland payloads"

[package.metadata.cupertino]
layer = "protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
