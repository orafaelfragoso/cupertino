[package]
name = "cupertino-server-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Compositor backend primitives: logind Smithay session, scheduling, display heads, DRM/EGL helpers, and evdev input"
autotests = false

[package.metadata.cupertino]
layer = "core"

[lib]
test = false

[dependencies]
anyhow = "1"
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-devices = { path = "../cupertino-devices" }
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-displays = { path = "../cupertino-displays" }
cupertino-input = { path = "../cupertino-input" }
cupertino-seat = { path = "../cupertino-seat" }
cupertino-wm = { path = "../cupertino-wm" }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_session",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
]

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
