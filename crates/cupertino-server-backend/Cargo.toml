[package]
name = "cupertino-server-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Compositor backend primitives: logind Smithay session, scheduling, display heads, DRM/EGL helpers, and evdev input"

[package.metadata.cupertino]
layer = "core"

[dependencies]
anyhow = "1"
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-devices = { path = "../cupertino-devices" }
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-displays = { path = "../cupertino-displays" }
cupertino-seat = { path = "../cupertino-seat" }
cupertino-wm = { path = "../cupertino-wm" }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = ["backend_egl", "backend_session", "renderer_gl", "wayland_frontend"]
