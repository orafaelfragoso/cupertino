  ["../../packaging/files/usr/lib/systemd/user/cupertino-session.target", "usr/lib/systemd/user/cupertino-session.target", "644"],
  ["../../crates/cupertino-files/data/applications/cupertino-files.desktop", "usr/share/applications/cupertino-files.desktop", "644"],
  ["../../crates/cupertino-files/data/applications/cupertino-mimeapps.list", "usr/share/applications/cupertino-mimeapps.list", "644"],
  ["../../crates/cupertino-settings/data/applications/cupertino-settings.desktop", "usr/share/applications/cupertino-settings.desktop", "644"],
  ["../../packaging/files/usr/lib/sysusers.d/cupertino-greeter.conf", "usr/lib/sysusers.d/cupertino-greeter.conf", "644"],
  ["../../packaging/files/usr/share/dbus-1/system.d/org.cupertino.conf", "usr/share/dbus-1/system.d/org.cupertino.conf", "644"],
  ["../../packaging/files/usr/share/xdg-desktop-portal/cupertino-portals.conf", "usr/share/xdg-desktop-portal/cupertino-portals.conf", "644"],
  ["../../packaging/files/etc/cupertino/login.conf", "etc/cupertino/login.conf", "644"],
  ["../../packaging/files/etc/cupertino/greeter.json", "etc/cupertino/greeter.json", "644"],
  ["../../packaging/files/etc/cupertino/compositor.json", "etc/cupertino/compositor.json", "644"],
  ["../../packaging/files/usr/lib/systemd/system/cupertino-login.service", "usr/lib/systemd/system/cupertino-login.service", "644"],
  ["../../packaging/files/usr/lib/systemd/system/cupertino-netd.service", "usr/lib/systemd/system/cupertino-netd.service", "644"],
