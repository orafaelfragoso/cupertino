[package]
name = "cupertino-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Smithay-based Wayland compositor: window policy from cupertino-wm, GLES shadows, rounded corners and material passes, dock and overview placeholders"

[package.metadata.cupertino]
layer = "core"

[lib]
name = "cupertino_server"

[[bin]]
name = "cupertino-server"
path = "src/main.rs"

[features]
default = ["winit", "udev", "dbus"]
winit = ["smithay/backend_winit"]
udev = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_session",
    "dep:smithay-drm-extras",
    "dep:cupertino-devices",
    "dep:cupertino-evdev",
    "dep:cupertino-seat",
]
# session bus worker: notification centre toggle
dbus = []

[dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-displays = { path = "../cupertino-displays" }
cupertino-protocols = { path = "../cupertino-protocols", features = ["server"] }
cupertino-wm = { path = "../cupertino-wm" }
cupertino-scene = { path = "../cupertino-scene" }
cupertino-render-api = { path = "../cupertino-render-api" }
cupertino-animation = { path = "../cupertino-animation" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-glass = { path = "../cupertino-glass" }
cupertino-overview = { path = "../cupertino-overview" }
cupertino-stage = { path = "../cupertino-stage" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-cursor = { path = "../cupertino-cursor" }
cupertino-effects = { path = "../cupertino-effects" }
cupertino-input = { path = "../cupertino-input" }
cupertino-keyboard = { path = "../cupertino-keyboard" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-devices = { path = "../cupertino-devices", optional = true }
cupertino-evdev = { path = "../cupertino-evdev", optional = true }
cupertino-peer = { path = "../cupertino-peer" }
cupertino-seat = { path = "../cupertino-seat", optional = true }
async-channel = "2"
libc = "0.2"
resvg = { version = "0.45", default-features = false }
tiny-skia = "0.11"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
wayland-scanner = "0.31"
wayland-server = "0.31"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustix = { version = "1", features = ["fs", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
xcursor = "0.3"
smithay-drm-extras = { version = "0.1", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = ["desktop", "wayland_frontend", "backend_egl", "backend_drm", "backend_gbm", "renderer_gl"]

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"
async-io = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cupertino-protocols = { path = "../cupertino-protocols", features = ["client"] }
# the asset icons the switcher test compares the dock process's panel with
cupertino-icons = { path = "../cupertino-icons" }
rustix = { version = "1", features = ["shm", "mm"] }

# Distribution packages. The asset lists are the manifest of packaging/release.py (checked by its check-metadata).
[package.metadata.deb]
name = "cupertino"
maintainer = "Rafael Fragoso <rafaelfragosom@gmail.com>"
copyright = "Cupertino contributors"
license-file = ["../../packaging/debian/cupertino.copyright", "0"]
extended-description = """\
A Wayland desktop shell and compositor: the server, the dock, menu bar, launcher, notifications, control centre, \
on-screen display, screenshots, window manager, lock and login screens, a file manager and settings. The system \
services (login manager, network, Bluetooth, power) are installed disabled."""
section = "x11"
priority = "optional"
depends = "$auto, cupertino-data (>= 0.1.0), dbus, systemd, polkitd, xdg-desktop-portal, xkb-data, shared-mime-info, adwaita-icon-theme, libegl1, libegl-mesa0"
recommends = "xdg-desktop-portal-gtk, libgl1-mesa-dri, libwayland-client0, libwayland-egl1, libxkbcommon0, xwayland"
suggests = "foot, iwd"
maintainer-scripts = "../../packaging/debian/scripts"
preserve-symlinks = true
conf-files = ["/etc/cupertino/login.conf", "/etc/cupertino/greeter.json", "/etc/cupertino/compositor.json", "/etc/pam.d/cupertino-login", "/etc/pam.d/cupertino-session", "/etc/pam.d/cupertino-greeter", "/etc/pam.d/cupertino-autologin"]
assets = [
  ["target/release/cupertino-server", "usr/bin/cupertino-server", "755"],
  ["target/release/cupertino-dock", "usr/bin/cupertino-dock", "755"],
  ["target/release/cupertino-menubar", "usr/bin/cupertino-menubar", "755"],
  ["target/release/cupertino-launcher", "usr/bin/cupertino-launcher", "755"],
  ["target/release/cupertino-notifications", "usr/bin/cupertino-notifications", "755"],
  ["target/release/cupertino-controlcenter", "usr/bin/cupertino-controlcenter", "755"],
  ["target/release/cupertino-osd", "usr/bin/cupertino-osd", "755"],
  ["target/release/cupertino-screenshot", "usr/bin/cupertino-screenshot", "755"],
  ["target/release/cupertino-windowmanager", "usr/bin/cupertino-windowmanager", "755"],
  ["target/release/cupertino-login", "usr/bin/cupertino-login", "755"],
  ["target/release/cupertino-files", "usr/bin/cupertino-files", "755"],
  ["target/release/cupertino-settings", "usr/bin/cupertino-settings", "755"],
  ["target/release/cupertino-sessiond", "usr/bin/cupertino-sessiond", "755"],
  ["target/release/cupertino-netd", "usr/bin/cupertino-netd", "755"],
  ["target/release/cupertino-btd", "usr/bin/cupertino-btd", "755"],
  ["target/release/cupertino-powerd", "usr/bin/cupertino-powerd", "755"],
