  ["../../data/theme/tokens.json", "usr/share/cupertino/theme/tokens.json", "644"],
  ["../../data/theme/materials.json", "usr/share/cupertino/theme/materials.json", "644"],
  ["../../data/theme/animations.json", "usr/share/cupertino/theme/animations.json", "644"],
  ["../../packaging/pam/deb/cupertino-login", "etc/pam.d/cupertino-login", "644"],
  ["../../packaging/pam/deb/cupertino-session", "etc/pam.d/cupertino-session", "644"],
