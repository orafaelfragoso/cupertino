[package]
name = "cupertino-session-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Program tests of the Cupertino desktop that start programs from more than one crate"
publish = false

[package.metadata.cupertino]
layer = "testing"

[dev-dependencies]
calloop = "0.14"
cupertino-assets = { path = "../cupertino-assets" }
cupertino-cli = { path = "../cupertino-cli" }
cupertino-controlcenter = { path = "../cupertino-controlcenter" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-login = { path = "../cupertino-login", features = ["dbus"] }
cupertino-menubar = { path = "../cupertino-menubar" }
cupertino-notifications = { path = "../cupertino-notifications" }
cupertino-osd = { path = "../cupertino-osd" }
cupertino-portal = { path = "../cupertino-portal" }
cupertino-screenshot = { path = "../cupertino-screenshot" }
cupertino-server = { path = "../cupertino-server" }
cupertino-shell = { path = "../cupertino-shell" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-wm = { path = "../cupertino-wm" }
image = { version = "0.25", default-features = false }
serde = "1"
rustix = { version = "1", features = ["fs", "process"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-server = "0.31"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
