[package]
name = "cupertino-session-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Program tests of the Cupertino desktop that start programs from more than one crate"
publish = false

[package.metadata.cupertino]
layer = "testing"

[dev-dependencies]
calloop = "0.14"
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-server = { path = "../cupertino-server" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-wm = { path = "../cupertino-wm" }
image = { version = "0.25", default-features = false }
rustix = { version = "1", features = ["fs", "process"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-server = "0.31"
