[package]
name = "cupertino-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Settings application without a toolkit: pane table, sidebar, navigation history, search, window layout and painter, and the `cupertino-settings` process"

[package.metadata.cupertino]
layer = "apps"

[features]
# the `cupertino-settings` process: the settings window as a client of the server
app = [
    "dep:cupertino-protocol-app",
    "dep:cupertino-ui-menus",
    "dep:cupertino-ui-wayland",
    "dep:cupertino-wayland-client",
    "dep:zbus",
    "dep:cupertino-alsa",
    "dep:async-channel",
]

[dependencies]
cupertino-menu-model = { path = "../cupertino-menu-model" }
cupertino-ui-menus = { path = "../cupertino-ui-menus", optional = true }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-filepicker = { path = "../cupertino-filepicker" }
cupertino-thumbnails = { path = "../cupertino-thumbnails" }
cupertino-typeahead = { path = "../cupertino-typeahead" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-decorations = { path = "../cupertino-decorations" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-text-field = { path = "../cupertino-text-field" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-protocol-app = { path = "../cupertino-protocol-app", optional = true }
cupertino-ui-wayland = { path = "../cupertino-ui-wayland", optional = true }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
cupertino-alsa = { path = "../cupertino-alsa", optional = true }
tiny-skia = "0.11"
zeroize = "1"
async-channel = { version = "2", optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
tempfile = "3"
serde_json = "1"

[[bin]]
name = "cupertino-settings"
path = "src/main.rs"
required-features = ["app"]

[[bench]]
name = "frame"
harness = false

[[example]]
name = "settings_samples"
