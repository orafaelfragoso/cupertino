[package]
name = "cupertino-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Settings application on CupertinoKit: pane table, sidebar, navigation history, search, the panes and their controls, and the `cupertino-settings` process"
autotests = false

[package.metadata.cupertino]
layer = "apps"

[features]
# the `cupertino-settings` process: the settings window as a client of the server
app = [
    "dep:async-io",
    "dep:cupertino-kit",
    "dep:cupertino-wayland-client",
    "dep:zbus",
    "dep:cupertino-alsa",
    "dep:cupertino-pipewire",
    "dep:async-channel",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
]

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-menu-model = { path = "../cupertino-menu-model" }
cupertino-kit = { path = "../cupertino-kit", optional = true }
cupertino-assets = { path = "../cupertino-assets" }
cupertino-build-info = { path = "../cupertino-build-info" }
cupertino-apps = { path = "../cupertino-apps" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-displays = { path = "../cupertino-displays" }
cupertino-filepicker = { path = "../cupertino-filepicker" }
cupertino-thumbnails = { path = "../cupertino-thumbnails" }
cupertino-typeahead = { path = "../cupertino-typeahead" }
cupertino-icons = { path = "../cupertino-icons" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-wayland-client = { path = "../cupertino-wayland-client", optional = true }
cupertino-alsa = { path = "../cupertino-alsa", optional = true }
cupertino-pipewire = { path = "../cupertino-pipewire", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
libc = "0.2"
zeroize = "1"
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[dev-dependencies]
cupertino-pipewire = { path = "../cupertino-pipewire", features = ["fake"] }
cupertino-test-bus = { path = "../cupertino-test-bus" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
tempfile = "3"
serde_json = "1"

[[bin]]
name = "cupertino-settings"
path = "src/main.rs"
required-features = ["app"]

[[test]]
name = "suite"
path = "tests/suite.rs"
