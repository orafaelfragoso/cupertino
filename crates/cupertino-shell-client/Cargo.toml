[package]
name = "cupertino-shell-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The privileged protocols of the Cupertino shell processes on the transport's queue: layer surfaces, the session lock, idle notification, the session observer and the menu-bar and dock roles"
autotests = false

[package.metadata.cupertino]
layer = "transport"

[dependencies]
cupertino-semantics = { path = "../cupertino-semantics" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-protocol-app = { path = "../cupertino-protocol-app" }
cupertino-protocols = { path = "../cupertino-protocols", features = ["client"] }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# the integration test runs a minimal protocol server in-process
[dev-dependencies]
cupertino-protocols = { path = "../cupertino-protocols", features = ["client", "server"] }
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
wayland-server = "0.31"

[[test]]
name = "suite"
path = "tests/suite.rs"
