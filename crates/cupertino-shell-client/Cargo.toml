[package]
name = "cupertino-shell-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The privileged protocols of the Cupertino shell processes on the transport's queue: layer surfaces, the session lock, idle notification, the session observer and the menu-bar and dock roles"
autotests = false
[package.metadata.cupertino]
layer = "transport"

[lib]
test = false

[dependencies]
cupertino-app-protocols = { path = "../cupertino-app-protocols" }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-protocols = { path = "../cupertino-protocols", features = ["client"] }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
cupertino-protocols = { path = "../cupertino-protocols", features = ["client", "server"] }
wayland-protocols = { version = "0.32", features = ["client", "server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
wayland-server = "0.31"

[[test]]
# Every file of `tests/` is a module of this one binary (`tests/main.rs`).
name = "tests"
path = "tests/main.rs"
