[package]
name = "cupertino-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shell host: runs the shell's components, each on a thread of its own, and restarts a failed one alone"

[package.metadata.cupertino]
layer = "shell"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cupertino-shell"
path = "src/main.rs"

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-controlcenter = { path = "../cupertino-controlcenter" }
cupertino-dock = { path = "../cupertino-dock" }
cupertino-launcher = { path = "../cupertino-launcher" }
cupertino-menubar = { path = "../cupertino-menubar" }
cupertino-notifications = { path = "../cupertino-notifications" }
cupertino-osd = { path = "../cupertino-osd" }
cupertino-shell-agent = { path = "../cupertino-shell-agent" }
cupertino-shell-desktop = { path = "../cupertino-shell-desktop" }
cupertino-shell-dialogs = { path = "../cupertino-shell-dialogs" }
cupertino-shell-overview = { path = "../cupertino-shell-overview" }
