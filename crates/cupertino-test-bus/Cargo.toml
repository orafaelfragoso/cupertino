[package]
name = "cupertino-test-bus"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "A private session bus for the Cupertino desktop's tests: a dbus-daemon child that dies with its test, with deadlines on its address and on every method call"
publish = false

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
