[package]
name = "cupertino-test-pam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A private PAM policy for the Cupertino desktop's tests: scripted accounts, the record of every PAM step, and the environment that loads the test shim so a process under test never reaches the machine's PAM stack, journal or buses"
publish = false

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
libc = "0.2"
tempfile = "3"
