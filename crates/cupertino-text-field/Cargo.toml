[package]
name = "cupertino-text-field"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Single-line text field model of the Cupertino apps: caret, selection, word and line moves, the standard editing chords, clipboard commands, undo, click counting, caret blink and a composition range"

[package.metadata.cupertino]
layer = "models"

[dependencies]
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-keyboard = { path = "../cupertino-keyboard" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
unicode-segmentation = "1.13"
