[package]
name = "cupertino-theme"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Typed access to the Cupertino design tokens, material recipes and animation presets loaded from the specification files"
autotests = false

[package.metadata.cupertino]
layer = "foundation"

[dependencies]
cupertino-animation = { path = "../cupertino-animation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "suite"
path = "tests/suite.rs"
