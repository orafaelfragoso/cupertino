[package]
name = "cupertino-ui-abi"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
# from 1.81 a panic that escapes an `extern "C"` function aborts instead of unwinding into C
rust-version = "1.81"
description = "CupertinoKit's C ABI v1: libcupertinokit.so.1 and its header"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[lib]
name = "cupertinokit"
crate-type = ["cdylib", "rlib"]

[dependencies]
cupertino-kit = { path = "../cupertino-kit" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
rustix = { version = "1", features = ["event"] }

[dev-dependencies]
cbindgen = { version = "=0.29.4", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rustix = { version = "1", features = ["event", "pipe"] }
toml = "1"

[[test]]
name = "suite"
path = "tests/suite.rs"
