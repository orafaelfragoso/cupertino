header = """/* SPDX-License-Identifier: MPL-2.0 */
/*
 * CupertinoKit C ABI 1.
 *
 * The soname is libcupertinokit.so.1, and functions carry no symbol versions. Pass the minor version the application
 * needs as abi_minor to ck_runtime_new; a library older than that refuses with CK_ERROR_VERSION. Before the first call
 * of a function added after 1.0, check that minor version or ck_has_capability: with lazy binding, a function the
 * installed library lacks fails when it is called, not when the application loads.
 *
 * Every function returns a ck_status and writes its out-parameters only on CK_OK. Handles are values: a zero, released
 * or foreign handle returns CK_ERROR_STALE_HANDLE. Inputs are copied during the call, and output is copied into the
 * caller's buffers, so nothing needs to be freed. A runtime and its windows belong to the thread that created the
 * runtime; only the waker functions may be called from other threads.
 */"""
