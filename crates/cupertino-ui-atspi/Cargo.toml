[package]
name = "cupertino-ui-atspi"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Publishes a CupertinoKit application's accessibility tree to assistive technology over AT-SPI, and hands their actions back to the application's loop"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
accesskit = "0.25"
accesskit_unix = "0.24"
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
unicode-segmentation = "1.13"

[dev-dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
