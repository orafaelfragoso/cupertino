[package]
name = "cupertino-ui-controls"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit controls: text, icons, buttons, toggles, text and secure fields, stacks and the rest of the standard set, each with its state matrix, keyboard map and accessibility semantics"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-menu-model = { path = "../cupertino-menu-model" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-typeahead = { path = "../cupertino-typeahead" }
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-layout = { path = "../cupertino-ui-layout" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-ui-theme = { path = "../cupertino-ui-theme" }

[dev-dependencies]
cupertino-ui-test = { path = "../cupertino-ui-test" }

[[test]]
name = "suite"
path = "tests/suite.rs"
