[package]
name = "cupertino-ui-core"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit runtime: the application model, elements and the retained node tree, event routing, focus, commands and tasks, and the accessibility tree"

[package.metadata.cupertino]
layer = "render"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-ui-layout = { path = "../cupertino-ui-layout" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-ui-theme = { path = "../cupertino-ui-theme" }

[dev-dependencies]
proptest = "1.12"
