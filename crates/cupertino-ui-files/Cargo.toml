[package]
name = "cupertino-ui-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CupertinoKit's file family: the items of a folder, their order, types, tags and names, the icon layout, opening, renaming and the file operations, and the measured metrics of the file views"
[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-apps = { path = "../cupertino-apps" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-trash = { path = "../cupertino-trash" }
cupertino-ui-controls = { path = "../cupertino-ui-controls" }
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
serde = { version = "1", features = ["derive"] }
xattr = "1"
tree_magic_mini = "3"
mime_guess = "2"
libc = "0.2"

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-ui-test = { path = "../cupertino-ui-test" }
