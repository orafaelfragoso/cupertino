[package]
name = "cupertino-ui-layout"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit layout: constraints, two-pass measure and place over a borrowed tree, stacks, grids, scroll math and virtualization windows; no display, font or scale factor"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }

[dev-dependencies]
proptest = "1.12"

[[bench]]
name = "layout"
harness = false

[[test]]
name = "suite"
path = "tests/suite.rs"
