[package]
name = "cupertino-ui-menus"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Publishes a CupertinoKit application's menus to the desktop menu bar as org.gtk.Menus and org.gtk.Actions on the session bus"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-menu-model = { path = "../cupertino-menu-model" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-protocol-app = { path = "../cupertino-protocol-app" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
cupertino-test-bus = { path = "../cupertino-test-bus" }
libc = "0.2"

[[test]]
name = "suite"
path = "tests/suite.rs"
