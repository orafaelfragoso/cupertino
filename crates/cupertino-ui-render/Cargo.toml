[package]
name = "cupertino-ui-render"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit rendering: the display list a window paints into, damage, the CPU renderer that draws it into premultiplied pixels and the GPU renderer that draws it with cupertino-gpu"
[package.metadata.cupertino]
layer = "ui"

[dependencies]
bumpalo = { version = "3.20", features = ["collections"] }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-gpu = { path = "../cupertino-gpu" }
cupertino-raster-math = { path = "../cupertino-raster-math" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
rustc-hash = "2.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tracing = "0.1"

[dev-dependencies]
gungraun = "=0.20.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "instructions"
harness = false
