[package]
name = "cupertino-ui-render"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit rendering: the display list a window paints into, damage, and the renderer that draws it into premultiplied pixels"

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
