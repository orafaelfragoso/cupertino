[package]
name = "cupertino-ui-render"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit rendering: the display list a window paints into, damage, and the renderer that draws it into premultiplied pixels"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-raster-math = { path = "../cupertino-raster-math" }
cupertino-theme = { path = "../cupertino-theme" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
