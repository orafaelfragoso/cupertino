[package]
name = "cupertino-ui-test"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit test harness: a headless window system, event-trace record and replay, and deterministic dumps of the layout, semantics and display list"

[package.metadata.cupertino]
layer = "render"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-ui-core = { path = "../cupertino-ui-core" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
