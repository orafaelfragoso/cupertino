[package]
name = "cupertino-ui-text"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit text: fonts and fallback, paragraph layout (bidi, line breaking, wrapping), grapheme caret and selection, the editing and secure buffers, and the input-method session"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-glyph = { path = "../cupertino-glyph" }
cupertino-key-bindings = { path = "../cupertino-key-bindings" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
swash = "0.2.10"
unicode-segmentation = "1.13"
harfrust = "0.15"
icu_segmenter = "2.4"
unicode-bidi = "0.3.18"
fontconfig = { version = "0.11", features = ["dlopen"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "suite"
path = "tests/suite.rs"
