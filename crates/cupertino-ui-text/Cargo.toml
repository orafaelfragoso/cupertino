[package]
name = "cupertino-ui-text"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit text: fonts and fallback, paragraph layout (bidi, line breaking, wrapping), grapheme caret and selection, the editing and secure buffers, and the input-method session"

[package.metadata.cupertino]
layer = "render"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
unicode-segmentation = "1.13"
harfrust = "0.15"
icu_segmenter = "2.4"
zeroize = { version = "1.9", features = ["derive"] }
