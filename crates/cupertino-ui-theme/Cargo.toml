[package]
name = "cupertino-ui-theme"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit theme tokens: semantic colours per control state, control metrics, type scale, focus ring and motion, from the neutral built-in theme or the Cupertino theme data"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-theme = { path = "../cupertino-theme" }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "suite"
path = "tests/suite.rs"
