[package]
name = "cupertino-ui-wayland"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit's window system on the Cupertino transport, and drawing on a surface of it with tiny-skia: frame pacing, damage and buffer conversion, popup placement and the text clipboard"

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
tiny-skia = "0.11"

# the integration test runs a minimal protocol server in-process
[dev-dependencies]
memmap2 = "0.9"
rustix = { version = "1", features = ["event"] }
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-server = "0.31"
