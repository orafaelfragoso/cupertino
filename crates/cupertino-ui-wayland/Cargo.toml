[package]
name = "cupertino-ui-wayland"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "Draws a surface of the Cupertino transport with tiny-skia: frame pacing, damage and buffer conversion, popup placement and the text clipboard"

[package.metadata.cupertino]
layer = "render"

[dependencies]
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
tiny-skia = "0.11"

# the integration test runs a minimal protocol server in-process
[dev-dependencies]
memmap2 = "0.9"
rustix = { version = "1", features = ["event"] }
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-server = "0.31"
