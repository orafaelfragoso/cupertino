[package]
name = "cupertino-ui-wayland"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
description = "CupertinoKit's window system on the Cupertino transport, and drawing on a surface of it with tiny-skia: frame pacing, damage and buffer conversion, popup placement and the text clipboard"
autotests = false

[package.metadata.cupertino]
layer = "ui"

[dependencies]
cupertino-diagnostic-events = { path = "../cupertino-diagnostic-events" }
cupertino-geometry = { path = "../cupertino-geometry" }
cupertino-gpu = { path = "../cupertino-gpu" }
cupertino-menu-model = { path = "../cupertino-menu-model" }
cupertino-modifiers = { path = "../cupertino-modifiers" }
cupertino-protocol-app = { path = "../cupertino-protocol-app" }
cupertino-ui-platform = { path = "../cupertino-ui-platform" }
cupertino-ui-menus = { path = "../cupertino-ui-menus" }
cupertino-ui-gpu = { path = "../cupertino-ui-gpu" }
cupertino-ui-render = { path = "../cupertino-ui-render" }
cupertino-ui-text = { path = "../cupertino-ui-text" }
cupertino-wayland-client = { path = "../cupertino-wayland-client" }
rustix = { version = "1", features = ["time"] }
tiny-skia = "0.12"

# the integration test runs a minimal protocol server in-process
[dev-dependencies]
cupertino-app-protocols = { path = "../cupertino-app-protocols", features = ["server"] }
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-test-bus = { path = "../cupertino-test-bus" }
memmap2 = "0.9"
rustix = { version = "1", features = ["event"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging"] }
wayland-server = "0.31"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
