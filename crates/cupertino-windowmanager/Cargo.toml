[package]
name = "cupertino-windowmanager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Window manager of the Cupertino desktop, a component of the shell host: the stage policy on cupertino-wm's stage model (stage on or off, groups, the strip of recent groups), placed in transactions, the stage strip a surface of its own whose thumbnails are holes, and `windowmanager.conf`"

[package.metadata.cupertino]
layer = "shell"

[lib]
test = false

[dependencies]
cupertino-defaults = { path = "../cupertino-defaults" }
cupertino-kit = { path = "../cupertino-kit" }
cupertino-kit-shell = { path = "../cupertino-kit-shell" }
cupertino-wm = { path = "../cupertino-wm" }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
cupertino-assets = { path = "../cupertino-assets" }
cupertino-kit = { path = "../cupertino-kit", features = ["test"] }

[[example]]
name = "windowmanager_capture"
