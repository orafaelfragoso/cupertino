[package]
name = "cupertino-wm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure-logic window-management model: apps, windows, lifecycle state machine, focus, snapping, workspaces"
autotests = false

[package.metadata.cupertino]
layer = "models"

[dependencies]
cupertino-animation = { path = "../cupertino-animation" }
cupertino-effects = { path = "../cupertino-effects" }
cupertino-input = { path = "../cupertino-input" }

[[test]]
name = "suite"
path = "tests/suite.rs"
