# Contracts registry: every Wayland global the server advertises, every D-Bus interface a Cupertino process serves, and
# every binary a workspace crate builds. Checked in CI by:
#   - crates/cupertino-server/tests/contracts.rs  (the globals each kind of connection sees, at run time)
#   - ci/contracts.py                             (D-Bus interfaces and org.cupertino.* names in the source, binaries)
#
# Format: a list of flat entries, one `key: value` per line, no quoting, no nesting. Both checkers read exactly this.
#   name        interface name, or binary name
#   kind        wayland-global | dbus-interface | binary
#   version     advertised version (globals), interface generation (D-Bus: the number in the name, n/a if none), crate
#               version (binaries); `unknown` where it cannot be measured
#   owner_crate workspace crate that defines it
#   owner_area  compositor | rendering | design | apps | services | packaging
#   scope       public: any client or application may use it
#               shell-private: only a process holding the named role (globals) or an allowed caller (D-Bus)
#               system: system bus, or a root-owned daemon
#   role        globals only: none, or the shell roles (any one of them) that see it; `internal client` for a
#               connection the server made for its own process
#   version_without_render_node
#               globals only, optional: the version when the EGL display has no render node (the server then builds
#               the global without default feedback, crates/cupertino-server/src/backend/mod.rs:61-73)
#   visible_to  globals only, optional: `unsandboxed` when a client connected through a security context
#               (wp_security_context_v1) does not see the global
#   advertised  globals only: always, or accent-table (only when the server is started with an accent table)
#   bus, bus_name  D-Bus only: session or system; the well-known name its owner claims (none if it claims none)
#   shipped     binaries only: yes when packaging/release.py installs it
#   test_owner  test file that exercises it, or `unknown`
#   source      path:line that defines it
- name: wl_compositor
  kind: wayland-global
  version: 5
  owner_crate: cupertino-server
  owner_area: compositor
  scope: public
  role: none
  advertised: always
  test_owner: crates/cupertino-server/tests/headless.rs
  source: crates/cupertino-server/src/state.rs:475
