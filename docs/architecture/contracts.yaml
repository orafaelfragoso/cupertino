  role: none
  advertised: always
  source: crates/cupertino-server/src/app_effects_v1.rs
  source_match: Cupertino, CupertinoAppEffectsV1
  note: Version 21 adds buffers_lost to cupertino_appearance_v1, the per-client observer every toolkit process holds: sent to each observer of version 21 or later after the server's GPU was reset or its video memory purged and its renderer made again (crates/cupertino-server/src/gpu_reset.rs, Cupertino::rebuild_render), never at creation. The client draws every surface whole again and commits it; a client whose own context was lost makes it again first..
- name: cupertino_layers_v1
  kind: wayland-global
  version: 6
  owner_crate: cupertino-server
  owner_area: compositor
  scope: public
  role: none
  advertised: always
  source: crates/cupertino-server/src/layers_v1.rs
  source_match: Cupertino, CupertinoLayersV1
  note: Surfaces of a client made layers of its own parent surface. Geometry in fixed point and every request of a layer apply with the parent's commit (a synchronized parent caches them); content applies on the layer surface's own commit and never holds the parent's (late content shows the placeholder colour in the bounds it does not cover). Timed and spring animations start with the first frame that shows their commit (at the latest 100 ms after it) on the server's clock, so they follow the time scale and the fixed time; a retarget keeps value and velocity and sends replaced, an animation that ends sends finished, a layer with none left settled. Reduce motion ends spatial animations at their target. Layers take no input; a window's are always clipped to the window, glass and placeholder included, with masks_to_bounds too and for a window that draws its own decorations (a layer shell surface's only by masks_to_bounds). The parent is an xdg_toplevel's, an xdg_popup's or a layer shell surface's main surface, and a layer surface becomes a layer again only once its layer object is destroyed (role otherwise). Limits: 64 layers per parent, 256 per client, 512 animations running or waiting per client (those queued in a parent's pending or cached state included), 16 layers of a parent per glass group (group_full otherwise), 10 s per timed animation, spring response 0.01 to 10 s and damping 0.05 to 4, lens 1 to 4. Values shown are held in range, nothing posted: origins within 1e6 points either way, sizes and radii up to 1e6, scale up to 64, Bézier y -10 to 11; a value or look queued again before the parent's commit replaces the earlier one. Version 2 adds get_presentation: a layer shell surface's own presentation, a layer object whose x, y, opacity and scale (about the surface's centre) apply to all the surface draws, its backdrops, popups and layers included, with the surface's own commit; the other properties and the look requests are invalid_property on it, one per surface (role otherwise), and input stays with the surface at rest; the toolkit hands a window with a shell role its open and close through it (crates/cupertino-ui-wayland/src/presentations.rs). Version 3 takes an xdg_popup's surface in get_presentation too (its scale about the centre of its window geometry, or of what its surfaces cover without one; its offset, opacity and scale apply to the popup, its subsurfaces and its backdrops after the rescale of its window or the presentation of its layer surface), and adds set_glass_group: layers of one parent with the same nonzero group draw their glass as one container of their shapes as shown at each frame, blended over the spacing (0 to 64 points, invalid_value otherwise), with the look of the group's first layer in drawing order, below its content; the toolkit hands a popover's growth and shrinking and a closing menu's fade through it (crates/cupertino-ui-core/src/runtime/handover.rs). Version 4 adds the content_blur property: the standard deviation of a Gaussian blur of a layer's own content in its points (0 to 64, invalid_value otherwise; invalid_property on a presentation and on a layer object below version 4), animatable on the server's clock and ended at its target under reduce motion. The server draws the content of a layer of the normal blend role into a texture with room for three deviations around it, cropped to what can show on the output and inside its mask with that reach around it and drawn sharp past 6144 x 4096 pixels or 8192 on a side, blurs it by the backdrop passes' pyramid and Gaussian keeping its alpha, and draws it in the content's place through the layer's mask, scale and opacity (crates/cupertino-server/src/render/content_blur.rs); a vibrant layer draws its content sharp; the client side is LayerProperty::ContentBlur (crates/cupertino-wayland-client/src/app/layers.rs). Version 4 also adds animate_samples: 2 to 1000 values of a property at even steps of a duration of 1 to 10000 ms, 32-bit floats in the host's byte order (invalid_curve otherwise, invalid_value for a value outside the property's range), followed in straight lines on the server's clock from the first, not from what is shown, to the last, where the property rests; an animation that replaces it keeps the value and the slope shown, and reduce motion ends a spatial one at its last value; the client side is Layer::animate_samples. Version 5 adds set_glass_edge(width, red, green, blue, alpha): a line width points wide (0 to 4, 0 none; invalid_value otherwise or for a channel outside 0 to 1) just outside the outline of a layer's glass, or of its glass group's joined shape with the group's first layer's edge, drawn by the glass composite over what lies there and over the glass's own antialiased edge as a stroke, at the output's scale so its width stays as the layer scales, left out where the group's shapes join and faded with the glass (crates/cupertino-glass/src/glass.rs, GlassEdge; crates/cupertino-server/src/render/layers.rs); the client side is Layer::set_glass_edge and the toolkit's SurfaceLayerLook::edge under Capabilities::surface_layer_edges. Version 6 adds no request: the edge along a layer's glass softens with that layer's content_blur, the band blurred in closed form by the Gaussian the layer's content is drawn with (its deviation scaled with the layer, none where the content is drawn sharp), and the glass reaches three deviations further for it; a layer object below version 6 keeps its edge sharp; the client side is Layers::softens_glass_edges.
- name: cupertino.control.v1
  kind: socket-protocol
  version: 1
  owner_crate: cupertino-control
  owner_area: services
  scope: shell-private
  source: crates/cupertino-control/src/mux.rs
  source_match: cupertino.control.v1
  note: Bounded sequential JSON lines over a mode-0600 session socket. Same-user peer identity and exact process lifetime are checked; each connection gets a fresh inactive run. Up to eight connections are served at once, each with one command in flight and its own run; a further connection is answered at once with an error saying the controller is full. The controller names the peer process (id and start time) to the compositor, which decides each request from the app's remembered answers and asks natively only for undecided services. The local wire protocol stays at 3, so older bridges keep working.
- name: cupertino_semantics_v1
  kind: wayland-global
  version: 2
  owner_crate: cupertino-server
  owner_area: compositor
  scope: public
  role: none
  advertised: always
  source: crates/cupertino-server/src/control/semantics.rs
  source_match: create_global::<Cupertino, CupertinoSemanticsV1, ()>
  note: Surface-owned sealed semantic publications. Publishing grants no control; only active scoped observation enables interest, and native actions require separate consent and current publication revisions. Version 2 sends a grab serial before each action: one popup grab of the action's window tree by its own client, while the action is handled and one second after an applied answer; moves, resizes, drags and activation tokens refuse it, and the grab it starts is held under a serial no client is given.
- name: cupertino_control_v1
  kind: wayland-global
  version: 5
  owner_crate: cupertino-server
  owner_area: compositor
  scope: shell-private
  role: DesktopControl
  advertised: always
  source: crates/cupertino-server/src/control.rs
  source_match: create_global::<Cupertino, CupertinoControlV1, ()>
  note: Version 1 stays discovery-only. Version 2 requests explicit output-scoped native consent, publishes granted geometry, routes bounded input with deduplicated outcomes and gates output capture by the exact run epoch. Lock, disconnect and stop revoke; the authentication prompt or a protected session panel suspends until it closes, and physical input never pauses a run. The role is not configurable. Version 3 adds bounded native semantic observation and consented actions, with authoritative surface transforms, exact publication revisions and asynchronous outcomes. Version 4 adds identify: the controller names its peer process, the compositor resolves its app (desktop entry of the window it runs under, else its parent's executable) and decides start from desktop-control.conf, refusing denied or unidentified requests and starting allowed ones without the panel. Version 5 allows eight sessions on the controller's connection, one independent run per agent with its own held input, asks runs that need consent one at a time, and adds select_capture, which binds the next output capture source to the selecting run.
- name: cupertino_control_authority_v1
  kind: wayland-global
  version: 2
  owner_crate: cupertino-server
  owner_area: compositor
