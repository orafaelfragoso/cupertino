# Contracts registry: every Wayland global the server advertises, every D-Bus interface a Cupertino process serves, and
# every binary a workspace crate builds. Checked in CI by:
#   - crates/cupertino-server/tests/contracts.rs  (the globals each kind of connection sees, at run time)
#   - ci/contracts.py                             (D-Bus interfaces and org.cupertino.* names in the source, binaries,
#                                                   C libraries)
#
# Format: a list of flat entries, one `key: value` per line, no quoting, no nesting. Both checkers read exactly this.
#   name        interface name, binary name, or the soname of a C library (the one its build script links with)
#   kind        wayland-global | dbus-interface | binary | socket-protocol | c-library
#   version     advertised version (globals), interface generation (D-Bus: the number in the name, n/a if none), crate
#               version (binaries), ABI version (C libraries: MAJOR.MINOR of the header under the crate's abi/, and
#               every crate that builds a cdylib has an entry); `unknown` where it cannot be measured
#   owner_crate workspace crate that defines it
#   owner_area  compositor | rendering | design | apps | services | packaging
#   scope       public: any client or application may use it
#               shell-private: only a process holding the named role (globals) or an allowed caller (D-Bus)
#               system: system bus, or a root-owned daemon
#   role        globals only: none, or the shell roles (any one of them) that see it; `internal client` for a
#               connection the server made for its own process
#   version_without_render_node
#               globals only, optional: the version when the EGL display has no render node (the server then builds
#               the global without default feedback, crates/cupertino-server/src/backend/mod.rs)
#   visible_to  globals only, optional: `unsandboxed` when a client connected through a security context
#               (wp_security_context_v1) does not see the global
#   advertised  globals only: always, or accent-table (only when the server is started with an accent table)
#   bus, bus_name  D-Bus only: session or system; the well-known name its owner claims (none if it claims none)
#   shipped     binaries only: yes when packaging/release.py installs it
#   test_owner  test file that exercises it, or `unknown`
#   source      file that defines it
#   source_match globals, D-Bus interfaces and sockets: text that must occur in the source file, such as the call that
#               creates the global (a library state constructor or `create_global`) or the quoted interface name or path;
#               binaries have none, their source is the file the binary target builds from. It only keeps the source
#               pointing at the right file: entries may share one (wl_compositor and wl_subcompositor), and the
#               globals themselves are proven at run time by crates/cupertino-server/tests/contracts.rs
- name: libcupertinokit.so.1
  kind: c-library
  version: 1.0
  owner_crate: cupertino-ui-abi
  owner_area: design
  scope: public
  test_owner: crates/cupertino-ui-abi/tests/symbols.rs
  source: crates/cupertino-ui-abi/src/lib.rs
  note: CupertinoKit's C ABI. The exported ck_* functions, the header and the struct layouts are pinned in crates/cupertino-ui-abi/abi/. Shipped in the cupertino-kit package as /usr/lib/libcupertinokit.so.1.<minor>.0 with the soname link, /usr/include/cupertinokit-1/cupertinokit.h and the pkg-config file cupertinokit.pc; release.py verify --package sdk checks the packaged library against the same baselines.
- name: /run/cupertino-login/greeter.sock
  kind: socket-protocol
  version: 5
  owner_crate: cupertino-login-ipc
  owner_area: services
  scope: system
  test_owner: crates/cupertino-login-ipc/tests/protocol.rs
  source: crates/cupertino-login-ipc/src/message.rs
  source_match: "/run/cupertino-login/greeter.sock"
  note: Carries authentication secrets between the greeter and the root session manager. cupertino-sessiond enforces access in bind (mode 0600, owned by the greeter user) and Manager::accept (SO_PEERCRED uid must be the greeter's; one login-screen connection at a time). Frames are capped at MAX_REQUEST_FRAME (2 KiB) from the greeter and MAX_EVENT_FRAME (4 MiB) to it.
