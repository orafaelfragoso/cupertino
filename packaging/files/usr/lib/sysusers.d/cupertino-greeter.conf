# The unprivileged account of the login screen: no password; home /var/lib/cupertino-greeter (tmpfiles.d makes it, 0700, owned by the account: the login screen's server keeps its log, settings watch and state under it) and the distribution's nologin shell ("-").
u cupertino-greeter - "Cupertino login screen" /var/lib/cupertino-greeter -
