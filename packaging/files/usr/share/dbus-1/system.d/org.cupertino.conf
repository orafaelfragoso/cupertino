<busconfig>
  <policy user="root">
    <allow own="org.cupertino.Network1"/>
    <allow own="org.freedesktop.NetworkManager"/>
    <allow own="org.cupertino.Bluetooth1"/>
    <allow own="org.cupertino.Power1"/>
    <allow own="org.freedesktop.UPower"/>
    <allow own="org.cupertino.LoginManager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cupertino.Network1"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.cupertino.Bluetooth1"/>
    <allow send_destination="org.cupertino.Power1"/>
    <allow send_destination="org.freedesktop.UPower"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.cupertino.LoginManager1" send_member="RequestPower"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.cupertino.LoginManager1" send_member="SwitchToLoginWindow"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.cupertino.LoginManager1" send_member="SessionReady"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.cupertino.LoginManager1" send_member="SetSystemAccessibility"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.cupertino.LoginManager1" send_member="CanSetSystemAccessibility"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.cupertino.LoginManager1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
