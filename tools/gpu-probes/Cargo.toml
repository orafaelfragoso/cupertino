[package]
name = "gpu-probes"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Measurements for the GPU rendering plan: context, program, render target and fence costs, and a deep-colour plane check. Never packaged."

# Its own workspace: the desktop's workspace excludes it, so `scripts/dev/build`, the package and CI never build it.
[workspace]

[dependencies]
libc = "0.2.191"
drm = "0.14.1"

[profile.release]
debug = "line-tables-only"
